<style>
:root{--blue:#1d4fd6;--blue2:#2f7bff;--sky:#e9f2ff;--sun:#ffc21a;--sun2:#ffdf6e;--red:#ef3b3b;--green:#22a559;--purple:#8e3fbf;--orange:#ff8a1f;--ink:#14213d;--mut:#5b6785;--card:#fff;--bg:#f4f7ff;--line:#dbe4f7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:Tajawal,Cairo,"Segoe UI",Tahoma,sans-serif;color:var(--ink);background:var(--bg);background-image:radial-gradient(circle at 90% -10%,#fff3c4 0,transparent 40%),radial-gradient(circle at -10% 110%,#dce9ff 0,transparent 45%);background-attachment:fixed;font-size:18px;line-height:1.7;padding-bottom:70px}
button{font:inherit;cursor:pointer;border:0}
.m{unicode-bidi:isolate;direction:rtl;font-family:Cairo,Tajawal,sans-serif;font-weight:700;white-space:nowrap;display:inline-block;padding:0 3px;color:#0f2d7a}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.15;font-size:.82em;margin:0 2px}
.fr>span:first-child{border-bottom:2px solid currentColor;padding:0 3px}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 4px 18px rgba(29,79,214,.25)}
header img{height:52px;width:auto;background:#fff;border-radius:14px;padding:3px 6px;cursor:pointer}
header .tt{flex:1;min-width:0}
header h1{margin:0;font:800 1.15rem/1.3 Cairo,Tajawal,sans-serif}
header small{opacity:.9;font-size:.85rem}
.hb{background:rgba(255,255,255,.18);color:#fff;border-radius:12px;padding:6px 12px;font-weight:700;display:flex;gap:6px;align-items:center;white-space:nowrap}
.hb.score{background:var(--sun);color:var(--ink)}
main{max-width:980px;margin:0 auto;padding:18px 14px}
.screen{display:none;animation:fade .35s}
.screen.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hero{display:flex;align-items:center;gap:16px;background:var(--card);border-radius:24px;padding:16px 18px;box-shadow:0 6px 24px rgba(20,33,61,.07);margin-bottom:18px;border:2px solid #fff}
.hero .bub{flex:1}
.hero h2{margin:0 0 4px;font:800 1.35rem Cairo,sans-serif;color:var(--blue)}
.hero p{margin:0;color:var(--mut)}
.mascot{width:96px;height:96px;flex:none;filter:drop-shadow(0 6px 10px rgba(255,170,0,.35))}
.mascot.bounce{animation:bnc .6s}
.mascot.shake{animation:shk .5s}
@keyframes bnc{30%{transform:translateY(-14px) scale(1.06)}60%{transform:translateY(0)}80%{transform:translateY(-4px)}}
@keyframes shk{20%,60%{transform:rotate(-8deg)}40%,80%{transform:rotate(8deg)}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.tile{background:var(--card);border-radius:20px;padding:14px 16px;display:flex;gap:12px;align-items:center;box-shadow:0 4px 16px rgba(20,33,61,.07);border:2px solid transparent;text-align:right;transition:transform .15s,border-color .15s;position:relative;overflow:hidden}
.tile:hover{transform:translateY(-3px);border-color:var(--sun)}
.tile .ic{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:1.6rem;flex:none}
.tile .n{font:800 .8rem Cairo;color:var(--mut)}
.tile .nm{font-weight:800;font-size:1.02rem;line-height:1.35}
.stars{color:#d5dbe8;letter-spacing:2px;font-size:1.05rem}
.stars b{color:var(--sun);font-weight:400}
.big-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:16px;padding:16px;border-radius:20px;background:linear-gradient(135deg,var(--red),var(--orange));color:#fff;font:800 1.2rem Cairo;box-shadow:0 8px 22px rgba(239,59,59,.3)}
.big-btn small{font:500 .85rem Tajawal;opacity:.9}
.card{background:var(--card);border-radius:22px;padding:18px 18px;box-shadow:0 6px 24px rgba(20,33,61,.07);margin-bottom:14px}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.back{background:#fff;color:var(--blue);border-radius:12px;padding:6px 14px;font-weight:800;box-shadow:0 2px 8px rgba(20,33,61,.08)}
.bar h2{margin:0;font:800 1.2rem Cairo;flex:1}
.prog{height:12px;background:#e3e9f7;border-radius:99px;overflow:hidden;flex:1;min-width:120px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),#7bd94e);border-radius:99px;transition:width .4s}
.slide h3{margin:0 0 8px;font:800 1.25rem Cairo;color:var(--blue)}
.rule{background:linear-gradient(135deg,#fff8dc,#fff2b8);border-right:6px solid var(--sun);border-radius:14px;padding:10px 14px;margin:10px 0;font-weight:600}
.rule.red{background:linear-gradient(135deg,#ffe9e9,#ffd9d9);border-color:var(--red)}
.rule.green{background:linear-gradient(135deg,#e6f8ee,#d3f3e1);border-color:var(--green)}
.ex{background:var(--sky);border-radius:16px;padding:12px 14px;margin:10px 0}
.ex .h{font:800 1rem Cairo;color:var(--blue);margin-bottom:4px}
.steps>div{display:none;padding:4px 10px;border-right:3px dashed var(--blue2);margin:6px 0;animation:fade .3s}
.steps>div.on{display:block}
.sbtn{background:var(--blue);color:#fff;border-radius:12px;padding:6px 14px;font-weight:700;margin-top:6px}
.sbtn.ghost{background:#fff;color:var(--blue);border:2px solid var(--blue)}
.nav{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:12px}
.nav .dots{display:flex;gap:6px}
.nav .dots i{width:10px;height:10px;border-radius:50%;background:#cfd8ee}
.nav .dots i.on{background:var(--blue);width:22px;border-radius:6px}
.btn{background:var(--blue);color:#fff;border-radius:14px;padding:10px 20px;font:800 1rem Cairo}
.btn.sun{background:var(--sun);color:var(--ink)}
.btn.green{background:var(--green)}
.btn.light{background:#fff;color:var(--blue);border:2px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}
table.t{border-collapse:collapse;width:100%;margin:8px 0;font-size:.95rem}
table.t td,table.t th{border:1px solid var(--line);padding:6px;text-align:center}
table.t th{background:var(--sky)}
.pos{color:var(--green);font-weight:800}.neg{color:var(--red);font-weight:800}
.nl{width:100%;max-width:640px;display:block;margin:6px auto;direction:ltr}
.q{font-size:1.15rem;font-weight:700;margin-bottom:12px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.opt{background:#fff;border:3px solid var(--line);border-radius:16px;padding:12px;font-size:1.15rem;font-weight:700;min-height:62px;transition:transform .1s,border-color .15s}
.opt:hover:not(:disabled){border-color:var(--blue2);transform:translateY(-2px)}
.opt.ok{border-color:var(--green);background:#e8f8ef}
.opt.no{border-color:var(--red);background:#ffecec}
.opt:disabled{cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chip{min-width:62px;padding:10px 14px;border-radius:14px;background:#fff;border:3px solid var(--line);font:800 1.2rem Cairo}
.chip.sel{background:var(--blue);border-color:var(--blue);color:#fff}
.chip.ok{background:var(--green);border-color:var(--green);color:#fff}
.chip.miss{border-color:var(--green);border-style:dashed}
.chip.no{background:var(--red);border-color:var(--red);color:#fff}
.tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.tool{background:#fff;border:3px solid var(--line);border-radius:12px;padding:6px 14px;font-weight:800}
.tool.on{border-color:var(--blue);background:var(--sky);color:var(--blue)}
.fb{margin-top:14px;border-radius:16px;padding:12px 14px;display:none;animation:fade .3s}
.fb.on{display:block}
.fb.ok{background:#e6f8ee;border:2px solid #9fe0bb}
.fb.no{background:#fff1f1;border:2px solid #ffc3c3}
.fb .ttl{font:800 1.05rem Cairo;margin-bottom:4px}
.qtop{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.qtop .mascot{width:70px;height:70px}
.say{flex:1;background:#fff;border-radius:16px;padding:8px 14px;font-weight:700;position:relative;box-shadow:0 3px 12px rgba(20,33,61,.07)}
.say:after{content:"";position:absolute;right:-8px;top:50%;margin-top:-8px;border:8px solid transparent;border-left-color:#fff;border-right:0}
.pill{background:var(--sun);border-radius:99px;padding:4px 12px;font:800 .95rem Cairo;white-space:nowrap}
.pill.fire{background:linear-gradient(135deg,var(--orange),var(--red));color:#fff}
.timer{height:14px;border-radius:99px;background:#ffe2d1;overflow:hidden;margin-bottom:10px}
.timer i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--orange));width:100%}
.res{text-align:center}
.res .bigstars{font-size:3.4rem;letter-spacing:6px;color:#d5dbe8}
.res .bigstars b{color:var(--sun);font-weight:400;display:inline-block;animation:pop .5s backwards}
@keyframes pop{from{transform:scale(0) rotate(-40deg)}}
.res h2{font:800 1.6rem Cairo;margin:6px 0;color:var(--blue)}
.foot{text-align:center;color:var(--mut);font-size:.85rem;margin-top:24px}
canvas#cf{position:fixed;inset:0;pointer-events:none;z-index:50}
@media (max-width:600px){body{font-size:16px}header h1{font-size:1rem}header img{height:42px}.mascot{width:72px;height:72px}.hb span{display:none}.opts{grid-template-columns:1fr 1fr}}
@media (min-width:1200px){body{font-size:20px}main{max-width:1120px}}
</style>
</head>
