<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="copyright" content="© مدرسة شمس الوطن. جميع الحقوق محفوظة.">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1565c0">
<title>معلّمتي شموسة — رياضيات الصف الثامن | مدرسة شمس الوطن</title>
<style>
:root{--blue:#1565c0;--sun:#f9b51b;--green:#1f9d55;--red:#e53935;--ink:#1d2a3a;--bg:#fff8ec;--card:#fff}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:"Tajawal","Segoe UI","Geeza Pro","Noto Sans Arabic",Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:clamp(16px,2.2vw,22px);line-height:1.7}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:8px 12px;background:linear-gradient(90deg,#1565c0,#1e88e5);color:#fff;box-shadow:0 3px 12px rgba(0,0,0,.15)}
.top img{width:46px;height:46px;border-radius:12px;background:#fff;padding:2px}
.top h1{font-size:1.05em;margin:0;line-height:1.2;flex:1}.top h1 small{display:block;font-size:.68em;font-weight:500;opacity:.9}
.top button{background:rgba(255,255,255,.18);border:0;color:#fff;font-size:1.25em;border-radius:12px;width:44px;height:44px;cursor:pointer}
#app{max-width:820px;margin:0 auto;padding:14px 14px 90px}
.tch{display:flex;gap:10px;align-items:flex-start;margin:12px 0}
.av{flex:none;width:72px;height:72px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.15))}.av svg,.av img{width:100%;height:100%;object-fit:contain}
.bub{background:#fff;border:2px solid #ffe08a;border-radius:18px 4px 18px 18px;padding:10px 14px;box-shadow:0 3px 10px rgba(0,0,0,.06);flex:1}
.tch.good .bub{border-color:#7ed4a1;background:#effbf3}.tch.bad .bub{border-color:#ffb3a7;background:#fff4f2}
.pop .bub{animation:pop .35s ease}@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.board{background:#fff;border-radius:18px;padding:14px;margin:10px 0;box-shadow:0 3px 12px rgba(0,0,0,.06);border:2px dashed #cfe0f5;text-align:center}
.m{font-weight:700;unicode-bidi:isolate;white-space:nowrap}.eq{font-size:1.35em;margin:8px 0;text-align:center}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.15;margin:0 .15em;font-size:.92em}.fr>span:first-child{border-bottom:2px solid currentColor;padding:0 .25em}
.rt{display:inline-flex;direction:rtl;gap:.35em;align-items:center;font-weight:700;unicode-bidi:isolate;color:#0d47a1}.rt i{font-style:normal;color:#e65100}
.steps{display:inline-flex;flex-direction:column;gap:6px;text-align:right;margin:6px auto}.st{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.st .m{font-size:1.15em}.st small{color:#6b7c93;background:#eef4fb;border-radius:8px;padding:0 8px}
.chk{background:#effbf3;border-radius:12px;padding:6px 10px;margin-top:8px;color:#14683a;font-size:.92em}
.rule{background:#fff6d6;border-right:6px solid var(--sun);border-radius:12px;padding:10px 14px;text-align:right;font-weight:700;margin:6px 0}
.pics{font-size:1.8em;letter-spacing:.08em;text-align:center;margin:8px 0;line-height:1.5}
.chain,.map{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;font-weight:700}.chain span,.map span{background:#e3f0ff;border-radius:10px;padding:2px 10px}
.bal{position:relative;height:150px;margin:6px auto 4px;max-width:420px}.beam{position:absolute;top:30px;right:5%;left:5%;height:8px;background:#795548;border-radius:6px;display:flex;justify-content:space-between;transition:transform .6s cubic-bezier(.3,1.6,.5,1)}
.pan{margin-top:8px;min-width:38%;background:#e3f0ff;border:3px solid #1565c0;border-top:0;border-radius:0 0 50% 50%/0 0 40% 40%;padding:16px 6px 10px;font-size:1.15em}
.post{position:absolute;top:34px;left:50%;width:10px;height:105px;background:#795548;transform:translateX(-50%);border-radius:4px}.post:after{content:"";position:absolute;bottom:-6px;left:-30px;width:70px;height:12px;background:#5d4037;border-radius:6px}
.bars{display:flex;justify-content:center;gap:4px;margin:10px 0;direction:rtl;flex-wrap:wrap}.grp{text-align:center}.cells{display:flex}.cells i{width:34px;height:34px;border:2px solid #fff;background:#64b5f6}.g1 .cells i{background:#ffb74d}.g2 .cells i{background:#81c784}
h2.ut{font-size:1.1em;margin:22px 0 8px;color:var(--blue)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.les{display:flex;flex-direction:column;align-items:center;gap:2px;background:#fff;border:2px solid #e3ecf7;border-radius:18px;padding:12px 8px;cursor:pointer;font:inherit;color:inherit;box-shadow:0 3px 8px rgba(0,0,0,.05);transition:transform .15s}
.les:active{transform:scale(.97)}.les .ic{font-size:1.8em}.les b{font-size:.95em;text-align:center}.les small{font-size:.75em;color:#6b7c93;text-align:center}.game{background:linear-gradient(160deg,#fff,#fff5dc)}
.stars{color:#f9a825;letter-spacing:2px}.off{color:#d8dee6}
.exam-btn{width:100%;padding:16px;font:inherit;font-weight:700;color:#fff;background:linear-gradient(90deg,#e65100,#f9a825);border:0;border-radius:18px;cursor:pointer;box-shadow:0 4px 12px rgba(230,81,0,.3)}
.card{background:#fff;border-radius:18px;padding:14px;margin:12px 0;box-shadow:0 3px 10px rgba(0,0,0,.05)}.center{text-align:center}.hist div{font-size:.88em;color:#4a5a70}
.inp{width:100%;font:inherit;padding:12px;border:2px solid #cfe0f5;border-radius:14px;margin-bottom:10px;text-align:center}
.btn{font:inherit;font-weight:700;border:0;border-radius:14px;padding:10px 18px;background:var(--blue);color:#fff;cursor:pointer;box-shadow:0 3px 8px rgba(21,101,192,.25)}
.btn.green{background:var(--green)}.btn.ghost{background:#fff;color:var(--blue);border:2px solid #cfe0f5;box-shadow:none}.btn.big{padding:14px 26px;font-size:1.1em}
.nav{display:flex;justify-content:space-between;gap:10px;margin:14px 0}.nav.wrap{flex-wrap:wrap;justify-content:center}
.link{background:none;border:0;color:#6b7c93;text-decoration:underline;font:inherit;cursor:pointer}.tiny{text-align:center;font-size:.8em}
.crumb{display:flex;justify-content:space-between;font-weight:700;color:var(--blue);gap:8px;flex-wrap:wrap}.crumb span{color:#6b7c93;font-weight:500;font-size:.9em}
.prog{height:8px;background:#e3ecf7;border-radius:6px;overflow:hidden;margin:6px 0}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),var(--green));transition:width .4s}
.qcard{background:#fff;border-radius:18px;padding:14px;box-shadow:0 3px 12px rgba(0,0,0,.06)}.qn{color:#6b7c93;font-size:.85em}.qq{font-weight:600;margin:4px 0 10px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.opts.col{grid-template-columns:1fr;margin-top:10px}
.opt{font:inherit;font-weight:700;font-size:1.1em;padding:12px 8px;background:#f4f8fd;border:2px solid #cfe0f5;border-radius:14px;cursor:pointer;color:var(--ink);min-height:56px}
.opt.right{background:#dcf5e5;border-color:var(--green)}.opt.wrong{background:#ffe3df;border-color:var(--red);animation:shake .4s}.opt.sel{background:#fff1c9;border-color:var(--sun)}.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(6px)}75%{transform:translateX(-6px)}}
.why{margin-top:6px;font-size:.95em}.sol{background:#f7fbff;border-radius:14px;padding:8px 12px;margin:8px 0;border:1px solid #e3ecf7;text-align:center}.sol summary{cursor:pointer;font-weight:700;color:var(--blue);text-align:right}
.result{text-align:center;margin:14px 0}.result h2{font-size:2em;margin:4px 0;color:var(--blue)}.big-stars{font-size:3em;color:#f9a825}.pct{font-size:1.2em}
.hud{display:flex;justify-content:space-around;background:#fff;border-radius:16px;padding:8px;margin-bottom:10px;font-size:1.15em;box-shadow:0 3px 10px rgba(0,0,0,.06)}
.win{font-size:1.8em;text-align:center;color:var(--green);margin:10px 0}
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}@media(min-width:620px){.mem{grid-template-columns:repeat(4,1fr)}}
.mc{position:relative;min-height:92px;border:0;border-radius:14px;font:inherit;cursor:pointer;background:linear-gradient(150deg,#1e88e5,#1565c0);color:#fff;padding:4px}
.mc .fc{display:none}.mc .bk{font-size:2em}.mc.up{background:#fff;color:var(--ink);border:2px solid #cfe0f5}.mc.up .fc{display:block}.mc.up .bk{display:none}.mc.done{background:#dcf5e5;border-color:var(--green)}.mc small{display:block;font-size:.7em;color:#6b7c93}
.conv{margin:auto;border-collapse:collapse}.conv td{border:1px solid #e3ecf7;padding:4px 14px}
.rhead{display:flex;align-items:center;gap:12px}.rhead img{width:70px}.rmeta{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin:8px 0;font-size:.92em}
.ubar{display:flex;align-items:center;gap:8px;margin:6px 0}.ubar span{width:130px;font-size:.9em}.ubar div{flex:1;height:14px;background:#e3ecf7;border-radius:8px;overflow:hidden}.ubar i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),var(--green))}
.rt-table{width:100%;border-collapse:collapse;margin:10px 0;font-size:.9em}.rt-table td,.rt-table th{border:1px solid #e3ecf7;padding:5px 8px}.rt-table th{background:#e3f0ff}
.rsig{text-align:center;font-size:.8em;color:#6b7c93}
#report{background:#fff;border-radius:18px;padding:14px;box-shadow:0 3px 10px rgba(0,0,0,.05)}
.rev{border-bottom:1px solid #e3ecf7;padding:8px 0;text-align:right}.rev.no{background:#fff9f8}
.feat{width:100%;display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit;color:#fff;border:0;border-radius:20px;padding:16px;margin-bottom:10px;cursor:pointer;background:linear-gradient(135deg,#ff6f91,#ffc75f);box-shadow:0 5px 16px rgba(255,111,145,.35)}.feat span{font-size:2em;animation:bob 1.6s ease-in-out infinite}.feat b{font-size:1.2em}@keyframes bob{50%{transform:translateY(-6px)}}
.bq{background:#fff;border-radius:16px;padding:8px 12px;margin-bottom:8px;font-weight:600;text-align:center;box-shadow:0 3px 10px rgba(0,0,0,.06)}.bq .eq{font-size:1.25em;margin:2px 0}.bq .pics{font-size:1.3em}
.sky{position:relative;height:62vh;min-height:380px;background:linear-gradient(#9fd8ff,#e8f6ff 60%,#fff3d6);border-radius:20px;overflow:hidden;touch-action:manipulation;user-select:none}
.cloud{position:absolute;font-size:3em;opacity:.8;animation:drift 18s linear infinite}.c1{top:8%;left:-15%}.c2{top:40%;left:-30%;animation-duration:26s;font-size:2.2em}@keyframes drift{to{transform:translateX(140vw)}}
.bw{position:absolute;left:0;top:0;will-change:transform}
.bln{position:relative;border:0;border-radius:50% 50% 46% 46%/56% 56% 44% 44%;display:flex;align-items:center;justify-content:center;color:#fff;font:inherit;font-weight:800;font-size:.95em;line-height:1.2;padding:4px;text-shadow:0 1px 3px rgba(0,0,0,.4);box-shadow:inset -9px -12px 0 rgba(0,0,0,.13),inset 9px 9px 0 rgba(255,255,255,.28);cursor:pointer;transition:transform .25s,opacity .25s}
.bln:after{content:"";position:absolute;bottom:-38px;left:50%;width:2px;height:36px;background:#9e9e9e}.bln:before{content:"";position:absolute;bottom:-6px;left:calc(50% - 6px);border:6px solid transparent;border-bottom-color:inherit;border-top:0}
.bln .fr{font-size:.9em}.bln.pop{transform:scale(1.6);opacity:0}.bln.bad{filter:grayscale(1);transform:rotate(-15deg) scale(.8);opacity:.3}
.spark{position:absolute;font-size:1.4em;pointer-events:none;animation:spark .7s ease-out forwards}@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.4);opacity:0}}
.toast{position:absolute;top:10px;left:50%;transform:translate(-50%,-20px);background:#fff;border-radius:14px;padding:6px 14px;font-weight:700;opacity:0;transition:.3s;z-index:3;text-align:center;max-width:90%;box-shadow:0 4px 12px rgba(0,0,0,.15)}.toast.show{opacity:1;transform:translate(-50%,0)}.toast.good{color:#14683a}.toast.bad{color:#c62828}
.combo{color:#e65100;font-weight:800}
.recipe{display:flex;flex-direction:column;gap:6px;text-align:right;max-width:520px;margin:6px auto}.recipe div{background:#eef6ff;border-radius:12px;padding:6px 12px;font-weight:600}.recipe b{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;margin-left:8px;font-size:.85em}
.exam-btn.alt{margin-top:10px;background:linear-gradient(90deg,#1565c0,#42a5f5)}.gotit{color:var(--green)!important;font-weight:700}
.paper{background:#fff;border-radius:16px;padding:14px;box-shadow:0 3px 12px rgba(0,0,0,.08);border:2px solid #dbe7f5}
.phead{display:flex;align-items:center;gap:10px;border-bottom:3px double #1565c0;padding-bottom:8px}.phead img{width:64px}.phead>div{flex:1;line-height:1.4}.pbox{flex:none!important;border:2px solid #1565c0;border-radius:10px;padding:4px 10px;text-align:center;font-size:.9em}
.sec{margin-top:14px}.sect{background:#1565c0;color:#fff;border-radius:10px;padding:4px 12px;font-weight:700}.sect small{font-weight:400;opacity:.9}
.item{display:flex;gap:8px;padding:10px 4px;border-bottom:1px dashed #dbe7f5}.ilab{font-weight:800;color:#1565c0;flex:none}.ibody{flex:1;min-width:0}.item .qq{margin:0 0 6px}
.item.iok{background:#f1fbf4}.item.ihalf{background:#fffaf0}.item.ino{background:#fff5f4}
.ain,.rin{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:700;font-size:1.1em}.rin{direction:rtl}.rin i{font-style:normal;color:#e65100;font-size:1.3em}
.ain input,.rin input{width:90px;font:inherit;font-weight:700;text-align:center;padding:6px;border:2px solid #cfe0f5;border-radius:10px;background:#fbfdff}.ain input:focus,.rin input:focus{outline:none;border-color:var(--blue)}
.badge{display:inline-block;font-weight:800;border-radius:10px;padding:0 10px;margin-top:6px}.iok .badge{background:#dcf5e5;color:#14683a}.ihalf .badge{background:#fff1c9;color:#8a5a00}.ino .badge{background:#ffe3df;color:#c62828}.corr{margin-top:4px}
@media print{.exam-btn,#act,.res details{display:none!important}.paper{box-shadow:none;border:0}.top,.tch,.nav,details,.card,#ka-signature{display:none!important}body{background:#fff}#report{box-shadow:none}}
</style>
</head>
