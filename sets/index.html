<title>صيّاد الرموز</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
/* Layout: one column game. Elements are amber balls, sets are teal bubbles; braces { } = "this is a bubble". */
:root {
  --bg: #eaf1f6;
  --surface: #ffffff;
  --surface2: #f2f7fb;
  --ink: #10243a;
  --muted: #55697e;
  --line: #cddae6;
  --brand: #2457e6;
  --on-brand: #ffffff;
  --ball: #f5a623;
  --ball-ink: #3b2500;
  --bub: #0f8f97;
  --bub-fill: rgba(18, 160, 168, 0.12);
  --ok: #17894b;
  --ok-fill: rgba(23, 137, 75, 0.12);
  --bad: #d23b4a;
  --bad-fill: rgba(210, 59, 74, 0.1);
  --display: "Lalezar", "Tajawal", system-ui, sans-serif;
  --body: "Tajawal", system-ui, "Segoe UI", sans-serif;
  --sym: "Tajawal", "Cambria Math", "STIX Two Math", "Noto Sans Math", "Segoe UI Symbol", "DejaVu Sans", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1823; --surface: #15263a; --surface2: #1b3149; --ink: #e8f0f8; --muted: #93a9bf;
    --line: #28425c; --brand: #7b97ff; --on-brand: #0b1020; --ball: #f7b43a; --ball-ink: #2a1a00;
    --bub: #35c4cc; --bub-fill: rgba(53, 196, 204, 0.14); --ok: #3ecf84; --ok-fill: rgba(62, 207, 132, 0.14);
    --bad: #ff6b78; --bad-fill: rgba(255, 107, 120, 0.14);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1823; --surface: #15263a; --surface2: #1b3149; --ink: #e8f0f8; --muted: #93a9bf;
  --line: #28425c; --brand: #7b97ff; --on-brand: #0b1020; --ball: #f7b43a; --ball-ink: #2a1a00;
  --bub: #35c4cc; --bub-fill: rgba(53, 196, 204, 0.14); --ok: #3ecf84; --ok-fill: rgba(62, 207, 132, 0.14);
  --bad: #ff6b78; --bad-fill: rgba(255, 107, 120, 0.14);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.6;
  padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
@media (min-width: 900px) { main { max-width: 980px; } main.wide { max-width: 1280px; } .levels { grid-template-columns: 1fr 1fr; } }
.arcwrap { display: grid; gap: 12px; }
.arcside { display: grid; gap: 12px; min-width: 0; }
.arcstage { display: flex; justify-content: center; min-width: 0; }
@media (min-width: 760px) and (min-aspect-ratio: 11/10) { .arcwrap { grid-template-columns: minmax(250px, 330px) 1fr; align-items: start; } .arcside { position: sticky; top: 10px; } }
#arc-wrap:fullscreen { background: var(--bg); padding: 12px; overflow: auto; align-content: start; }
.lb { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.lbrow { display: grid; grid-template-columns: 34px 1fr auto auto; gap: 10px; align-items: center; background: var(--surface2); border-radius: 12px; padding: 8px 12px; }
.lbrow.me { outline: 2px solid var(--brand); }
.lbrow .rk { font: 400 1.3rem var(--display); color: var(--brand); }
.lbrow .wv { color: var(--muted); font-size: .85rem; }
.lbrow .sc { font-variant-numeric: tabular-nums; }
.lbbtn { width: 100%; background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; padding: 12px 16px; font: 400 1.25rem var(--display); }
.ov-save { display: grid; gap: 6px; width: 100%; }
.ov-save input { font: inherit; padding: 8px 12px; border-radius: 10px; border: 1.5px solid #5fe0e8; background: rgba(255,255,255,.1); color: #fff; text-align: center; }
.tbar span.boss { background: #a874ee; }
.ov .row .btn { padding: 8px 14px; font-size: .95rem; min-height: 40px; }
.ov-card .btn { min-height: 44px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, summary:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; text-wrap: balance; }
.ltr, .m { direction: rtl; unicode-bidi: isolate; font-family: var(--sym); }
.sg { direction: var(--sgdir, rtl); unicode-bidi: isolate; }

/* pieces */
.ball { display: inline-grid; place-items: center; min-width: 2em; height: 2em; padding: 0 .35em; border-radius: 50%;
  background: var(--ball); color: var(--ball-ink); font: 800 1rem/1 var(--sym); }
.bub { display: inline-flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px; min-width: 3em; min-height: 3em;
  padding: 10px 14px; border: 2.5px solid var(--bub); background: var(--bub-fill); border-radius: 999px; }
.bub .bub { padding: 4px 8px; min-height: 2.4em; min-width: 2.4em; border-width: 2px; background: var(--surface); }
.bub .empty { font-style: normal; color: var(--bub); font-weight: 700; padding: 0 .3em; }
.fig { margin: 0; display: grid; justify-items: center; gap: 6px; }
.fig figcaption { font-size: .85rem; color: var(--muted); font-weight: 700; }
.figbody { direction: rtl; }

/* hero */
.hero { display: grid; gap: 14px; padding: 6px 0 2px; }
.hero h1 { font: 400 clamp(2.6rem, 11vw, 3.6rem)/1.05 var(--display); }
.hero p { color: var(--muted); font-size: 1.05rem; max-width: 36ch; }
.versus { display: flex; align-items: center; justify-content: center; gap: 18px; padding: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; flex-wrap: wrap; }
.versus .ne { font: 700 2rem var(--sym); color: var(--muted); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 18px; display: grid; gap: 14px; }
.panel h2 { font: 400 1.5rem/1.2 var(--display); }
.rule { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; padding: 12px 14px; background: var(--surface2); border-radius: 14px; }
.ico { width: 52px; height: 52px; object-fit: contain; }
.pic { display: block; }
.hero { height: 120px; width: auto; max-width: 100%; }
.scene { display: block; width: 100%; max-width: 520px; height: auto; margin: 0 auto; background: var(--surface2); border-radius: 16px; direction: ltr; }
.sbig { fill: var(--bub-fill); stroke: var(--bub); stroke-width: 3.5; }
.alab { font: 800 22px var(--sym); fill: var(--bub); }
.sb { fill: var(--bub-fill); stroke: var(--bub); stroke-width: 3; }
.sball { fill: var(--ball); stroke: var(--ink); stroke-width: 2; }
.stxt { font: 800 18px var(--sym); fill: var(--ball-ink); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.stxt.s { font-size: 14px; }
.obj { cursor: pointer; outline: none; }
.hl { fill: none; stroke: transparent; stroke-width: 5; }
.obj:hover .hl, .obj:focus-visible .hl { stroke: var(--brand); }
.obj.right .hl { stroke: var(--ok); }
.obj.wrong .hl { stroke: var(--bad); }
.obj.dim { opacity: .5; }
.scene.done .obj { pointer-events: none; }
.fbico { width: 38px; height: 38px; object-fit: contain; }
.fb .hd { display: flex; align-items: center; gap: 10px; }
.mascot { width: 120px; height: auto; }
.rule .ex { font: 700 1.35rem var(--sym); white-space: nowrap; }
.rule b { color: var(--brand); }
.note { color: var(--muted); font-size: .95rem; }

/* level list */
.levels { display: grid; gap: 10px; }
.lv { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px; text-align: start; width: 100%;
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 18px; padding: 14px 16px; transition: transform .15s, border-color .15s; }
.lv:hover { border-color: var(--brand); transform: translateY(-2px); }
.lv .no { width: 44px; height: 44px; border-radius: 12px; background: var(--brand); color: var(--on-brand); display: grid; place-items: center; font: 400 1.6rem/1 var(--display); }
.lv .t { font-weight: 800; font-size: 1.1rem; display: block; }
.lv .s { color: var(--muted); font-size: .92rem; display: block; }
.lv .sy { font: 700 1.1rem var(--sym); color: var(--bub); direction: rtl; text-align: end; display: block; }
.lv .st { letter-spacing: 2px; color: var(--ball); font-size: 1.1rem; direction: rtl; display: block; text-align: end; }
.lv .st i { font-style: normal; color: var(--line); }

/* guide */
details.guide { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; }
details.guide summary { padding: 14px 18px; font-weight: 800; cursor: pointer; }
.gbody { padding: 0 18px 18px; display: grid; gap: 10px; }
.gtable { width: 100%; border-collapse: collapse; }
.gscroll { overflow-x: auto; }
.gtable th, .gtable td { text-align: start; padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: top; font-size: .95rem; }
.gtable th { color: var(--muted); font-weight: 700; font-size: .85rem; }
.gtable .sym { font: 800 1.6rem/1 var(--sym); color: var(--brand); text-align: center; width: 2.4em; }
.gtable .eg { direction: rtl; text-align: end; white-space: nowrap; font-family: var(--sym); font-weight: 700; }

/* play */
.top { display: grid; gap: 10px; }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.back { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 6px 14px; font-weight: 700; }
.ttl { font: 400 1.3rem/1.2 var(--display); text-align: center; flex: 1; }
.hud { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.hearts { display: flex; gap: 4px; font-size: 1.5rem; line-height: 1; color: var(--bad); direction: rtl; }
.hearts .gone { color: var(--line); }
.chip { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px 14px; font-weight: 800; font-variant-numeric: tabular-nums; }
.chip.hot { border-color: var(--ball); color: var(--ball-ink); background: var(--ball); }
.prog { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 5px; direction: rtl; }
.prog span { height: 8px; border-radius: 4px; background: var(--line); }
.prog .done { background: var(--ok); }
.prog .miss { background: var(--bad); }
.prog .now { background: var(--brand); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 20px 18px; display: grid; gap: 16px; }
.prompt { color: var(--muted); font-weight: 700; }
.defs { display: grid; gap: 6px; direction: rtl; }
.defs div { font: 700 1.2rem var(--sym); background: var(--surface2); border-radius: 12px; padding: 8px 14px; overflow-wrap: anywhere; }
.expr { direction: rtl; display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; font: 800 clamp(1.8rem, 8vw, 2.6rem)/1.2 var(--sym); padding: 10px 0; }
.slot { min-width: 1.6em; text-align: center; border-radius: 14px; padding: 0 .25em; border: 2.5px dashed var(--brand); color: var(--brand); }
.slot.ok { border: 2.5px solid var(--ok); color: var(--ok); background: var(--ok-fill); }
.slot.bad { border: 2.5px solid var(--bad); color: var(--bad); background: var(--bad-fill); }
.slot.fixed { border-style: solid; color: var(--ink); border-color: var(--line); background: var(--surface2); }
.tools { display: flex; justify-content: center; }
.link { background: none; border: none; color: var(--brand); font-weight: 700; padding: 4px 8px; text-decoration: underline; text-underline-offset: 4px; }
.figs { display: flex; justify-content: center; flex-wrap: wrap; gap: 22px; padding: 12px; background: var(--surface2); border-radius: 16px; }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 10px; }
.opt { display: grid; justify-items: center; gap: 2px; background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 10px 8px; min-height: 76px; transition: transform .12s, border-color .12s; }
.opt:hover:not(:disabled) { border-color: var(--brand); transform: translateY(-2px); }
.opt .g { font: 800 2rem/1.1 var(--sym); direction: rtl; }
.opt .n { font-size: .85rem; color: var(--muted); font-weight: 700; text-align: center; }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--ok); background: var(--ok-fill); }
.opt.wrong { border-color: var(--bad); background: var(--bad-fill); animation: shake .35s; }
.opt.dim { opacity: .5; }
.tf .g { font-family: var(--body); font-size: 1.4rem; }
.fb { border-radius: 16px; padding: 14px 16px; display: grid; gap: 8px; }
.fb.ok { background: var(--ok-fill); border: 1.5px solid var(--ok); animation: pop .3s; }
.fb.bad { background: var(--bad-fill); border: 1.5px solid var(--bad); }
.fb h3 { font: 400 1.4rem/1.2 var(--display); }
.fb.ok h3 { color: var(--ok); } .fb.bad h3 { color: var(--bad); }
.fb p { overflow-wrap: anywhere; }
.fb .ltr { font-weight: 700; }
.btn { background: var(--brand); color: var(--on-brand); border: none; border-radius: 14px; padding: 12px 22px; font-weight: 800; font-size: 1.05rem; min-height: 48px; }
.btn.alt { background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); }
.btn:hover { filter: brightness(1.08); }

/* end */
.end { text-align: center; justify-items: center; }
.end .stars { font-size: 3rem; letter-spacing: 6px; color: var(--ball); direction: rtl; line-height: 1; }
.end .stars i { font-style: normal; color: var(--line); }
.end h2 { font: 400 2rem/1.2 var(--display); }
.stats { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.stats .chip b { color: var(--brand); }
.row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

.splash { position: relative; min-height: 78vh; display: grid; align-content: center; justify-items: center; gap: 16px; text-align: center; padding: 24px 0; overflow: hidden; }
.splash h1 { font: 400 clamp(3rem, 14vw, 4.6rem)/1 var(--display); }
.splash p { color: var(--muted); max-width: 30ch; font-size: 1.1rem; }
.logo { display: block; height: auto; background: #fff; border-radius: 16px; padding: 6px; box-shadow: 0 2px 10px rgba(0,0,0,.15); }
.logo.big { width: min(250px, 72%); }
.logo.sm { width: 92px; }
.hero .logo.sm { width: 84px; }
.btn.start { font: 400 1.8rem/1 var(--display); padding: 16px 44px; border-radius: 18px; min-height: 64px; box-shadow: 0 6px 0 rgba(0,0,0,.25); }
.btn.start:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.25); }
.fl { position: absolute; width: 58px; opacity: .9; animation: bob 3.2s ease-in-out infinite; pointer-events: none; }
.flimg { width: 100%; height: auto; display: block; }
.tog { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.tbtn { background: var(--surface); border: 1.5px solid var(--line); border-radius: 999px; padding: 6px 16px; font-weight: 700; min-height: 40px; }
.card { position: relative; }
.card.shk { animation: shake .35s; }
.tbar { height: 10px; background: var(--line); border-radius: 6px; overflow: hidden; }
.tbar span { display: block; height: 100%; background: var(--brand); border-radius: 6px; transition: width .1s linear; }
.tbar span.low { background: var(--bad); }
.pop { position: absolute; inset-inline-end: 18px; top: 28px; font: 400 2rem/1 var(--display); color: var(--ok); animation: rise 1s forwards; pointer-events: none; }
.confetti { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 5; }
.confetti i { position: absolute; top: -16px; width: 10px; height: 14px; border-radius: 2px; animation: fall 2.4s ease-in forwards; }
.k0 { background: var(--ball); } .k1 { background: var(--bub); } .k2 { background: var(--brand); } .k3 { background: var(--ok); }
@keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }
@keyframes rise { from { transform: translateY(8px); opacity: 0; } 25% { opacity: 1; } to { transform: translateY(-36px); opacity: 0; } }
@keyframes bob { 50% { transform: translateY(-14px); } }
.arcbtn { width: 100%; text-align: start; border: none; border-radius: 20px; padding: 18px; color: #e8f6fb; background: linear-gradient(160deg, #0e5a74, #06263c); display: grid; gap: 4px; box-shadow: 0 6px 0 rgba(0,0,0,.25); transition: transform .15s; }
.arcbtn:hover { transform: translateY(-2px); }
.arcbtn .t { font: 400 1.7rem/1.1 var(--display); }
.arcbtn .s { opacity: .85; }
.arcbtn .hi { font-weight: 800; color: #ffd98a; }
.arule { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 10px 14px; }
.aA { font: 700 1rem var(--sym); overflow-wrap: anywhere; }
.aR { font: 800 1.9rem var(--sym); display: flex; gap: 10px; align-items: center; color: var(--brand); }
.aR b { padding: 0 .3em; border: 2.5px solid var(--brand); border-radius: 12px; }
.aP { display: grid; gap: 4px; font-size: .85rem; color: var(--muted); }
.arena { direction: ltr; position: relative; width: min(100%, 460px); margin: 0 auto; border-radius: 22px; overflow: hidden; border: 2px solid var(--line); aspect-ratio: var(--ar, .7143); background: #041626; }
.arena canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.ov { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(4,22,38,.84); padding: 14px; z-index: 2; color: #e8f6fb; text-align: center; overflow: auto; }
.ov-card { display: grid; gap: 10px; justify-items: center; max-width: 320px; }
.ov-wave { font: 400 1.5rem var(--display); color: #7be8ef; }
.ov-rule { font: 800 3rem var(--sym); direction: rtl; }
.ov-A { font: 700 1.1rem var(--sym); direction: rtl; background: rgba(255,255,255,.1); padding: 4px 14px; border-radius: 12px; }
.ov-note { color: #ffd98a; }
.ov-big { font: 400 3.4rem/1 var(--display); color: #ffd98a; }
.ov-rec { color: #7bf0a8; font-weight: 800; }
.ov-stats { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; font-weight: 700; }
.ov-mis { text-align: start; background: rgba(255,255,255,.08); border-radius: 12px; padding: 8px 12px; font-size: .85rem; display: grid; gap: 4px; }
.ov-mis p { overflow-wrap: anywhere; }
.toast { position: absolute; inset-inline: 10px; bottom: 52px; background: rgba(4,22,38,.93); color: #fff; border: 1.5px solid #ff6b78; border-radius: 12px; padding: 8px 12px; font-size: .9rem; z-index: 1; pointer-events: none; overflow-wrap: anywhere; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
@keyframes pop { from { transform: scale(.96); opacity: .4; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
