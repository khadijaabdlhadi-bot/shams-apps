<style>
/* Layout: header band, then a card grid (1 column on phones, up to 3 on wide screens), QR footer. */
:root{--bg:#eef3f7;--surface:#fff;--ink:#10243a;--muted:#55697e;--line:#d3dee8;--brand:#0f6f86;--brand-ink:#fff;--accent:#f5a623;--chip:#e3f3f5;--chip-ink:#0b6672;
--display:"Lalezar","Tajawal",system-ui,sans-serif;--body:"Tajawal",system-ui,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1722;--surface:#132536;--ink:#e6eef6;--muted:#93a8bd;--line:#26405a;--brand:#35b6c6;--brand-ink:#05202a;--accent:#f7b43a;--chip:#173a4a;--chip-ink:#9fe3ea;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1722;--surface:#132536;--ink:#e6eef6;--muted:#93a8bd;--line:#26405a;--brand:#35b6c6;--brand-ink:#05202a;--accent:#f7b43a;--chip:#173a4a;--chip-ink:#9fe3ea;color-scheme:dark}
*{box-sizing:border-box}html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--body);padding-block:22px 90px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:1080px;margin:0 auto;display:grid;gap:22px}
header{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
header img{width:84px;height:auto;border-radius:16px;background:#fff;padding:5px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
h1{margin:0;font:400 clamp(1.9rem,6vw,2.7rem)/1.1 var(--display);text-wrap:balance}
header p{margin:4px 0 0;color:var(--muted)}
.top-actions{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap}
button,.btn{font:inherit;font-weight:700;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 16px;min-height:44px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.main{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
button:focus-visible,.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.grid{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:640px){.grid{grid-template-columns:1fr 1fr}}@media(min-width:980px){.grid{grid-template-columns:1fr 1fr 1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:grid;grid-template-rows:auto 1fr auto}
.thumb{display:block;aspect-ratio:12/11;background:#0c243a;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.body{padding:14px 16px 6px;display:grid;gap:6px;align-content:start;min-width:0}
.body h2{margin:0;font:400 1.45rem/1.2 var(--display)}
.tag{justify-self:start;font-size:.78rem;font-weight:800;letter-spacing:.3px;background:var(--chip);color:var(--chip-ink);border-radius:999px;padding:2px 10px}
.body p{margin:0;color:var(--muted);font-size:.95rem}
.url{font-size:.78rem;color:var(--muted);direction:ltr;text-align:right;overflow-wrap:anywhere}
.acts{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px 16px}.acts .main{flex:1}
.extra{font-size:.85rem;padding:0 16px 14px}.extra a{color:var(--brand);font-weight:700}
footer{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px}
footer img{width:130px;height:130px;border-radius:12px;background:#fff;padding:4px}
footer h3{margin:0;font:400 1.3rem var(--display)}footer p{margin:4px 0 0;color:var(--muted);font-size:.92rem}
.toast{position:fixed;inset-inline:16px;bottom:calc(64px + env(safe-area-inset-bottom,0px));margin:auto;max-width:360px;background:var(--ink);color:var(--bg);text-align:center;border-radius:12px;padding:10px 14px;font-weight:700}
.copy{text-align:center;color:var(--muted);font-size:.82rem}
@media(max-width:420px){footer{grid-template-columns:1fr;justify-items:center;text-align:center}}

    function fallback() { var a = document.createElement('textarea'); a.value = text; a.setAttribute('readonly', ''); a.style.position = 'fixed'; a.style.opacity = '0'; document.body.appendChild(a); a.select(); var ok = false; try { ok = document.execCommand('copy'); } catch (e) {} a.remove(); say(ok ? 'تم نسخ الرابط' : text); }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { say('تم نسخ الرابط'); }, fallback); else fallback();
  }
  function share(title, url) {
    if (navigator.share) navigator.share({ title: title, url: url }).catch(function () {}); else copy(url);
  }
  APPS.forEach(function (a) {
    var c = document.createElement('article'); c.className = 'card';
    var th = document.createElement('a'); th.className = 'thumb'; th.href = a.url; th.target = '_blank'; th.rel = 'noopener';
    var im = document.createElement('img'); im.src = THUMBS[a.id] || THUMBS.logo; im.alt = ''; th.appendChild(im);
    var b = document.createElement('div'); b.className = 'body';
    var tg = document.createElement('span'); tg.className = 'tag'; tg.textContent = a.tag;
    var h = document.createElement('h2'); h.textContent = a.name;
    var p = document.createElement('p'); p.textContent = a.desc;
    var u = document.createElement('div'); u.className = 'url'; u.textContent = a.url.replace('https://', '');
    b.append(tg, h, p, u);
    var acts = document.createElement('div'); acts.className = 'acts';
    var o = document.createElement('a'); o.className = 'btn main'; o.href = a.url; o.target = '_blank'; o.rel = 'noopener'; o.textContent = 'افتح';
    var cp = document.createElement('button'); cp.textContent = 'نسخ الرابط'; cp.onclick = function () { copy(a.url); };
    var sh = document.createElement('button'); sh.textContent = 'مشاركة'; sh.onclick = function () { share(a.name, a.url); };
    acts.append(o, cp, sh);
    c.append(th, b, acts);
    if (a.extra) { var x = document.createElement('div'); x.className = 'extra'; var xl = document.createElement('a'); xl.href = a.extra.url; xl.textContent = a.extra.label; x.appendChild(xl); c.appendChild(x); }
    grid.appendChild(c);
  });
  document.getElementById('share-all').onclick = function () { share('تطبيقات شمس الوطن', HUB); };
  document.getElementById('copy-all').onclick = function () { copy(HUB); };
})();
