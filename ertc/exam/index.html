<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ERTC — Course Test</title>
<meta name="robots" content="noindex">
<style>
:root{--ink:#14213d;--muted:#5c6b80;--line:#dfe5ee;--bg:#f4f6fa;--card:#fff;--brand:#b3202a;--brand2:#14213d;--ok:#1d7a46;--sel:#fdecee}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
header{background:var(--brand2);color:#fff;padding:16px 18px 14px;position:sticky;top:0;z-index:5}
header .t{font-weight:700;letter-spacing:.04em;font-size:13px;opacity:.8}
header .s{font-size:18px;font-weight:700}
.bar{height:4px;background:rgba(255,255,255,.18);border-radius:4px;margin-top:10px;overflow:hidden;display:none}
.bar i{display:block;height:100%;width:0;background:var(--brand);transition:width .25s}
main{max-width:640px;margin:0 auto;padding:18px 16px 120px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:14px}
h1{font-size:22px;margin:0 0 6px}
h2{font-size:18px;margin:0 0 10px}
p{margin:0 0 12px}
.muted{color:var(--muted)}
label{display:block;font-weight:600;margin:14px 0 6px}
input{width:100%;font:inherit;padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
input:focus{outline:none;border-color:var(--brand2)}
button{font:inherit;font-weight:700;border:0;border-radius:11px;padding:14px 18px;cursor:pointer;background:var(--brand);color:#fff;width:100%}
button.sec{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
button:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px}
.row>*{flex:1}
.qn{font-size:13px;font-weight:700;color:var(--brand);letter-spacing:.05em;margin-bottom:6px}
.qt{font-size:17px;font-weight:600;margin-bottom:16px}
.opt{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:10px;cursor:pointer;background:#fff;transition:border-color .12s,background .12s}
.opt .l{flex:0 0 28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:var(--muted)}
.opt.on{border-color:var(--brand);background:var(--sel)}
.opt.on .l{background:var(--brand);border-color:var(--brand);color:#fff}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.nav .in{max-width:640px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0}
.grid b{display:flex;align-items:center;justify-content:center;height:42px;border-radius:10px;border:1.5px solid var(--line);font-weight:700;cursor:pointer;background:#fff}
.grid b.a{background:var(--brand2);color:#fff;border-color:var(--brand2)}
.grid b.m{border-color:var(--brand);color:var(--brand)}
.big{font-size:44px;line-height:1;margin-bottom:12px}
.err{color:var(--brand);font-weight:600;margin-top:10px;min-height:1em}
.pill{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:22px}
.hidden{display:none!important}
</style>
</head>
<body>
<header>
  <div class="t">EMERGENCY ROOM TRAUMA COURSE</div>
  <div class="s" id="hsub">Course Test</div>
  <div class="bar" id="bar"><i></i></div>
</header>
<main id="app"><div class="card"><p class="muted">Loading…</p></div></main>
<div class="nav hidden" id="nav"><div class="in row">
  <button class="sec" id="prev">Back</button>
  <button id="next">Next</button>
</div></div>

<script src="config.js"></script>
<script src="common.js"></script>
<script src="questions.js"></script>
<script src="app.js"></script>
<script data-goatcounter="https://shams-alwatan.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
