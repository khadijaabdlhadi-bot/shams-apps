<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="copyright" content="© مدرسة شمس الوطن. جميع الحقوق محفوظة.">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>رحلة الأزمنة — Tense Quest | مدرسة شمس الوطن</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:Tajawal,"Segoe UI",system-ui,sans-serif;color:#fff;background:#0b1026;user-select:none;-webkit-user-select:none}
.en{font-family:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Varela Round","Nunito","Segoe UI",sans-serif;direction:ltr;letter-spacing:.2px}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
.screen{position:fixed;inset:0;display:none;flex-direction:column;overflow:hidden}
.screen.on{display:flex}

/* ---------- HOME ---------- */
#home{background:radial-gradient(ellipse at 50% 120%,#ff8a3d 0%,#c2185b 28%,#4a148c 55%,#0b1026 85%);}
#home .stars,#game .stars{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(2px 2px at 20px 30px,#fff,transparent),radial-gradient(1.5px 1.5px at 120px 80px,#ffe,transparent),radial-gradient(2px 2px at 220px 150px,#fff,transparent),radial-gradient(1px 1px at 300px 40px,#fff,transparent),radial-gradient(1.5px 1.5px at 380px 200px,#fdf,transparent);background-size:400px 260px;opacity:.7;animation:twinkle 4s ease-in-out infinite alternate}
@keyframes twinkle{to{opacity:.25}}
.clockring{position:absolute;width:140vmin;height:140vmin;left:50%;top:58%;transform:translate(-50%,-50%);border-radius:50%;border:2px dashed rgba(255,220,150,.25);animation:spin 60s linear infinite;pointer-events:none}
.clockring::after{content:"";position:absolute;inset:9vmin;border-radius:50%;border:1px solid rgba(255,255,255,.12)}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.hhead{position:relative;z-index:2;text-align:center;padding:max(14px,env(safe-area-inset-top)) 10px 0}
.logo{font-size:clamp(30px,6.5vmin,64px);font-weight:900;letter-spacing:1px;background:linear-gradient(90deg,#ffe082,#fff,#80deea,#ffe082);background-size:200%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shine 5s linear infinite;filter:drop-shadow(0 4px 10px rgba(0,0,0,.4))}
@keyframes shine{to{background-position:200%}}
.sub{font-size:clamp(14px,2.6vmin,24px);opacity:.92;margin-top:2px}
.sub .en{color:#ffe082;font-weight:700}
.mascots{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none;z-index:1;padding:0 1vw}
.mascots svg{width:clamp(80px,17vmin,200px);height:auto;animation:bob 2.6s ease-in-out infinite}
.mascots .m2 svg{animation-delay:1.3s}
@keyframes bob{50%{transform:translateY(-10px) rotate(2deg)}}
.bubble{position:absolute;bottom:clamp(125px,26vmin,305px);background:#fff;color:#4a148c;padding:6px 12px;border-radius:16px;font-weight:800;font-size:clamp(12px,2vmin,18px);white-space:nowrap;box-shadow:0 4px 10px rgba(0,0,0,.25)}
.m1 .bubble{right:4px}.m2 .bubble{left:4px}
.worlds{position:relative;z-index:2;flex:1;display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(8px,1.6vmin,18px);padding:clamp(10px,2vmin,22px) clamp(12px,13vmin,230px) clamp(110px,19vmin,220px);align-content:center;overflow:auto}
.wcard{flex:0 1 clamp(140px,22vmin,230px);position:relative;border-radius:22px;padding:12px 10px 10px;text-align:center;min-height:clamp(118px,19vmin,190px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 8px 0 rgba(0,0,0,.25),0 12px 24px rgba(0,0,0,.35);border:3px solid rgba(255,255,255,.55);transition:transform .2s;overflow:hidden}
.wcard:active{transform:scale(.95)}
.wcard:hover{transform:translateY(-4px) rotate(-1deg)}
.wcard .ic{font-size:clamp(34px,6vmin,58px);filter:drop-shadow(0 4px 4px rgba(0,0,0,.3))}
.wcard .t{font-weight:900;font-size:clamp(14px,2.3vmin,21px);line-height:1.15}
.wcard .te{font-size:clamp(11px,1.8vmin,16px);font-weight:700;opacity:.95;background:rgba(0,0,0,.22);padding:2px 8px;border-radius:10px}
.wcard .st{font-size:clamp(13px,2vmin,18px);letter-spacing:2px}
.wcard .num{position:absolute;top:6px;right:9px;font-weight:900;opacity:.55;font-size:13px}
.c-factory{background:linear-gradient(145deg,#00897b,#004d40)}
.c-vault{background:linear-gradient(145deg,#f9a825,#a0522d)}
.c-lava{background:linear-gradient(145deg,#e64a19,#33691e)}
.c-night{background:linear-gradient(145deg,#283593,#0d1137)}
.c-lab{background:linear-gradient(145deg,#b87333,#4e342e)}
.c-ice{background:linear-gradient(145deg,#4fc3f7,#1a237e)}
.c-tower{background:linear-gradient(145deg,#ff6f00,#6a1b9a)}
.homebar{position:absolute;top:max(10px,env(safe-area-inset-top));left:10px;z-index:3;display:flex;gap:8px}
.pill{background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.35);border-radius:999px;padding:6px 12px;font-weight:800;font-size:clamp(12px,1.9vmin,17px);backdrop-filter:blur(4px)}

/* ---------- LESSON ---------- */
#lesson{background:linear-gradient(160deg,#fffdf5,#fff3e0);color:#3e2723;overflow:auto}
.lwrap{max-width:900px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 16px 120px;width:100%}
.lhead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.lhead .ic{font-size:52px}
.lhead h2{font-size:clamp(22px,4vmin,34px);font-weight:900}
.lhead .en{font-size:clamp(15px,2.4vmin,22px);color:#6a1b9a;font-weight:800}
.box{background:#fff;border-radius:18px;padding:14px 16px;margin:10px 0;box-shadow:0 3px 0 #ffcc80,0 6px 16px rgba(0,0,0,.06);border:2px solid #ffe0b2;font-size:clamp(15px,2.3vmin,20px);line-height:1.7}
.box h3{font-size:clamp(16px,2.5vmin,21px);color:#e65100;margin-bottom:4px}
.formula{direction:ltr;text-align:center;font-weight:900;font-size:clamp(18px,3.2vmin,30px);color:#fff;background:linear-gradient(90deg,#7b1fa2,#c2185b);border-radius:14px;padding:10px;margin:8px 0}
.ex{direction:ltr;display:flex;align-items:center;gap:10px;padding:6px 4px;border-bottom:1px dashed #ffe0b2;font-size:clamp(16px,2.6vmin,23px)}
.ex:last-child{border:0}
.ex b{color:#c2185b}
.say{flex:none;width:38px;height:38px;border-radius:50%;background:#ffecb3;font-size:19px;box-shadow:0 3px 0 #ffb300}
.say:active{transform:translateY(2px);box-shadow:none}
.tags{display:flex;flex-wrap:wrap;gap:6px;direction:ltr}
.tag{background:#e1f5fe;color:#01579b;border-radius:999px;padding:3px 12px;font-weight:800;font-size:clamp(14px,2.1vmin,18px)}
.lfoot{position:fixed;bottom:0;left:0;right:0;display:flex;gap:10px;justify-content:center;padding:12px 12px max(12px,env(safe-area-inset-bottom));background:linear-gradient(transparent,#fff3e0 40%)}
.big{font-weight:900;font-size:clamp(17px,2.8vmin,25px);padding:12px 26px;border-radius:999px;box-shadow:0 6px 0 rgba(0,0,0,.25);transition:transform .1s}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.go{background:linear-gradient(180deg,#66bb6a,#2e7d32);color:#fff}
.back{background:#fff;color:#4a148c;border:2px solid #ce93d8}
table.tt{width:100%;border-collapse:collapse;direction:ltr;font-size:clamp(13px,2vmin,18px)}
table.tt td,table.tt th{border:1px solid #ffe0b2;padding:6px;text-align:center}
table.tt th{background:#fff3e0;color:#e65100}

/* ---------- GAME SHELL ---------- */
#game{color:#fff}
.ghead{position:relative;z-index:20;display:flex;align-items:center;gap:8px;padding:max(8px,env(safe-area-inset-top)) 10px 6px}
.gbtn{width:44px;height:44px;border-radius:14px;background:rgba(0,0,0,.35);border:2px solid rgba(255,255,255,.4);font-size:22px;flex:none}
.gtitle{font-weight:900;font-size:clamp(15px,2.6vmin,24px);text-shadow:0 2px 4px rgba(0,0,0,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gspace{flex:1}
.prog{display:flex;gap:4px;direction:ltr}
.prog i{width:clamp(8px,1.4vmin,14px);height:clamp(8px,1.4vmin,14px);border-radius:50%;background:rgba(255,255,255,.3);border:1px solid rgba(255,255,255,.6)}
.prog i.ok{background:#76ff03}.prog i.no{background:#ff5252}.prog i.cur{background:#ffeb3b;transform:scale(1.3)}
.hearts{font-size:clamp(16px,2.6vmin,24px);letter-spacing:2px}
.score{background:rgba(0,0,0,.35);border-radius:999px;padding:5px 12px;font-weight:900;font-size:clamp(14px,2.4vmin,22px);border:2px solid #ffd54f;direction:ltr}
#arena{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 10px max(54px,calc(env(safe-area-inset-bottom) + 50px));gap:clamp(8px,1.8vmin,18px);overflow:hidden}
.scene{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
#arena>*:not(.scene){position:relative;z-index:2}
.card{background:rgba(255,255,255,.95);color:#1a1a2e;border-radius:20px;padding:clamp(10px,2vmin,18px) clamp(14px,3vmin,28px);font-size:clamp(19px,3.8vmin,38px);font-weight:800;text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.2);max-width:min(94vw,1000px);line-height:1.35}
.card,.crate{direction:ltr}
.blank{display:inline-block;min-width:3.2em;border-bottom:4px dashed #e91e63;color:#e91e63;padding:0 4px}
.blank.fill{border-bottom-style:solid}
.blank.good{color:#2e7d32;border-color:#2e7d32}
.blank.bad{color:#d32f2f;border-color:#d32f2f;text-decoration:line-through}
.card .base{color:#6a1b9a;font-size:.75em}
.spk{display:inline-grid;place-items:center;width:1.5em;height:1.5em;border-radius:50%;background:#fff3e0;font-size:.7em;vertical-align:middle;margin-inline-start:6px;box-shadow:0 3px 0 #ffb74d}
.hint{font-size:clamp(13px,2.1vmin,19px);opacity:.95;text-shadow:0 2px 3px rgba(0,0,0,.6);text-align:center;font-weight:700}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.pop{animation:pop .5s}
@keyframes pop{40%{transform:scale(1.15)}}

/* ---------- 1 FACTORY ---------- */
.w-factory{background:linear-gradient(180deg,#0f2b2b 0%,#134e4a 55%,#1b1b1b 100%)}
.w-factory .scene::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 120px,rgba(255,255,255,.04) 120px 124px),repeating-linear-gradient(0deg,transparent 0 80px,rgba(0,0,0,.12) 80px 82px)}
.gear{position:absolute;border-radius:50%;border:10px dotted #ff9800;opacity:.35;animation:gspin 8s linear infinite}
.gear::after{content:"";position:absolute;inset:30%;border-radius:50%;background:#ff9800}
@keyframes gspin{to{transform:rotate(360deg)}}
.pipe{position:absolute;height:18px;background:linear-gradient(#90a4ae,#455a64,#90a4ae);border-radius:9px;opacity:.5}
.lamp{position:absolute;top:0;width:4px;height:60px;background:#555}
.lamp::after{content:"";position:absolute;bottom:-18px;left:-16px;width:36px;height:20px;border-radius:0 0 20px 20px;background:#ffca28;box-shadow:0 20px 60px 20px rgba(255,202,40,.25)}
.fline{display:flex;align-items:flex-end;gap:clamp(10px,3vw,40px);width:100%;max-width:1100px;justify-content:center}
.belt{position:relative;flex:1;max-width:760px;height:clamp(245px,38vmin,350px);display:flex;flex-direction:column;justify-content:flex-end}
.press{position:absolute;top:0;left:50%;width:clamp(70px,12vmin,120px);transform:translateX(-50%);z-index:3;transition:transform .18s ease-in}
.press .rod{width:22%;height:clamp(30px,6vmin,60px);margin:0 auto;background:linear-gradient(90deg,#78909c,#eceff1,#78909c)}
.press .head{height:clamp(26px,4.5vmin,44px);border-radius:8px;background:linear-gradient(#ff9800,#e65100);border:3px solid #3e2723;display:grid;place-items:center;font-weight:900;color:#3e2723;font-size:12px}
.press.down{transform:translate(-50%,clamp(28px,6vmin,62px))}
.box{transition:none}
.crate{position:relative;margin:0 auto 6px;background:linear-gradient(#ffe0b2,#ffcc80);color:#3e2723;border:4px solid #8d6e63;border-radius:10px;padding:clamp(8px,1.6vmin,14px) clamp(12px,2.4vmin,22px);font-weight:800;font-size:clamp(17px,3.4vmin,32px);text-align:center;box-shadow:0 6px 0 #6d4c41;transition:transform .7s cubic-bezier(.4,1.4,.6,1);max-width:96%}
.crate.in{transform:translateX(-140vw)}
.crate.out{transform:translateX(140vw);transition:transform .7s ease-in}
.crate.ok{border-color:#2e7d32;box-shadow:0 6px 0 #1b5e20,0 0 30px #76ff03}
.crate.bad{border-color:#c62828;box-shadow:0 6px 0 #8e0000,0 0 30px #ff1744}
.conv{height:clamp(22px,3.6vmin,34px);border-radius:20px;background:repeating-linear-gradient(90deg,#263238 0 26px,#455a64 26px 52px);border:4px solid #111;animation:belt 1s linear infinite;background-size:52px 100%}
@keyframes belt{to{background-position:52px 0}}
.conv.stop{animation-play-state:paused}
.robot{flex:none;width:clamp(100px,18vmin,180px)}
.robot .p{opacity:.08;transition:opacity .5s,transform .5s;transform-origin:center}
.robot .p.on{opacity:1;animation:pop .5s}
.robot .lbl{text-align:center;font-weight:900;font-size:clamp(12px,1.9vmin,17px);margin-top:4px;color:#ffcc80}
.stamps{display:flex;gap:clamp(10px,2.4vw,30px);flex-wrap:wrap;justify-content:center}
.stamp{direction:ltr;min-width:clamp(110px,18vmin,190px);font-weight:900;font-size:clamp(19px,3.4vmin,32px);padding:clamp(10px,1.8vmin,16px) 16px;border-radius:14px 14px 26px 26px;background:linear-gradient(#ef5350,#b71c1c);border:4px solid #fff;box-shadow:0 8px 0 #4e0000;position:relative}
.stamp::before{content:"";position:absolute;top:-18px;left:50%;width:34px;height:18px;transform:translateX(-50%);background:#5d4037;border-radius:8px 8px 0 0}
.stamp:nth-child(2){background:linear-gradient(#42a5f5,#0d47a1);box-shadow:0 8px 0 #002171}
.stamp:nth-child(3){background:linear-gradient(#ab47bc,#4a148c);box-shadow:0 8px 0 #1a0033}
.stamp:active{transform:translateY(6px);box-shadow:0 2px 0 #000}

/* ---------- 2 VAULT (pyramid) ---------- */
.w-vault{background:linear-gradient(180deg,#ffb74d 0%,#ff8f00 35%,#e65100 60%,#bf8040 60.2%,#d7a35a 100%)}
.pyr{position:absolute;bottom:40%;clip-path:polygon(50% 0,100% 100%,0 100%);background:linear-gradient(110deg,#ffe0a3 50%,#c8893c 50%)}
.sunv{position:absolute;top:8%;right:12%;width:14vmin;height:14vmin;border-radius:50%;background:#fff59d;box-shadow:0 0 80px 30px rgba(255,245,157,.6)}
.dune{position:absolute;bottom:-8vmin;width:70vw;height:30vmin;border-radius:50%;background:#e0b26a}
.gate{position:relative;width:min(92vw,760px);border-radius:24px 24px 8px 8px;padding:clamp(10px,2vmin,20px);background:linear-gradient(#8d6e63,#5d4037);border:6px solid #3e2723;box-shadow:inset 0 0 0 4px #ffca28,0 14px 30px rgba(0,0,0,.4);overflow:hidden}
.gate::before{content:"𓂀  ☥  𓆣  ☥  𓂀";position:absolute;top:2px;left:0;right:0;text-align:center;color:#ffca28;opacity:.7;letter-spacing:8px;font-size:14px}
.treasure{position:absolute;inset:0;display:none;place-items:center;font-size:clamp(50px,13vmin,120px);background:radial-gradient(#fff59d,#ffb300 60%,#5d4037);z-index:8;text-align:center}
.treasure small{display:block;font-size:clamp(16px,3vmin,28px);color:#3e2723;font-weight:900;direction:ltr;margin-top:6px}
.gate.open .treasure{display:grid;animation:reveal 1s ease-out}
@keyframes reveal{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
.dials{display:flex;gap:clamp(10px,3vw,30px);justify-content:center;align-items:center;flex-wrap:wrap;direction:ltr}
.dial{display:flex;flex-direction:column;align-items:center;gap:4px}
.dial button.ar{width:clamp(46px,8vmin,70px);height:clamp(32px,5vmin,46px);border-radius:12px;background:#ffca28;color:#3e2723;font-size:clamp(18px,3vmin,26px);font-weight:900;box-shadow:0 4px 0 #ff6f00}
.dial button.ar:active{transform:translateY(3px);box-shadow:none}
.wheel{min-width:clamp(140px,26vmin,260px);padding:clamp(10px,2vmin,18px) 14px;border-radius:50px;background:radial-gradient(#d7ccc8,#8d6e63);border:6px solid #ffca28;color:#3e2723;font-weight:900;font-size:clamp(20px,4vmin,38px);text-align:center;box-shadow:inset 0 -8px 0 rgba(0,0,0,.2),0 6px 0 #3e2723;transition:transform .25s}
.wheel.roll{animation:roll .3s}
@keyframes roll{0%{transform:rotateX(0)}50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
.wheel.bad{border-color:#ff1744;animation:shake .45s}
.wheel.good{border-color:#00e676}
.emo{font-size:clamp(44px,9vmin,90px);filter:drop-shadow(0 6px 6px rgba(0,0,0,.3))}
.openbtn{background:linear-gradient(#ffd54f,#ff8f00);color:#3e2723}

/* ---------- 3 LAVA ---------- */
.w-lava{background:linear-gradient(180deg,#1b5e20 0%,#33691e 30%,#4e342e 62%,#bf360c 63%,#ff6d00 100%)}
.volc{position:absolute;bottom:37%;left:50%;width:70vmin;height:34vmin;transform:translateX(-50%);clip-path:polygon(38% 0,62% 0,100% 100%,0 100%);background:linear-gradient(#3e2723,#5d4037)}
.volc::before{content:"";position:absolute;top:0;left:38%;width:24%;height:30%;background:linear-gradient(#ff3d00,transparent);animation:glow 1.5s ease-in-out infinite alternate}
@keyframes glow{to{opacity:.4}}
.lavaflow{position:absolute;left:0;right:0;bottom:0;height:37%;background:radial-gradient(circle at 20% 40%,#ffea00 0 4%,transparent 5%),radial-gradient(circle at 70% 70%,#ffea00 0 3%,transparent 4%),linear-gradient(#ff6d00,#d50000);}
.lavaflow::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 40% 30%,rgba(255,235,59,.55),transparent 40%),radial-gradient(circle at 80% 60%,rgba(255,235,59,.45),transparent 35%);animation:lava 2.6s ease-in-out infinite alternate;will-change:opacity}
@keyframes lava{from{opacity:.2}to{opacity:1}}
.palm{position:absolute;font-size:12vmin;bottom:60%}
.lpath{position:relative;width:min(96vw,980px);height:clamp(190px,36vmin,330px)}
.rock{position:absolute;width:clamp(110px,20vmin,200px);height:clamp(50px,8vmin,80px);border-radius:50%;background:radial-gradient(ellipse at 40% 30%,#8d6e63,#3e2723);box-shadow:0 8px 0 #1b0000;display:grid;place-items:center;font-weight:900;font-size:clamp(18px,3.4vmin,32px);color:#fff;direction:ltr;transition:transform .6s, opacity .6s;border:3px solid rgba(255,200,120,.6)}
button.rock:active{filter:brightness(1.3)}
.rock.home{left:2%;top:50%;transform:translateY(-50%)}
.rock.a{right:6%;top:4%}
.rock.b{right:6%;bottom:4%}
.rock.sink{transform:translateY(80px) scale(.6);opacity:0}
.rock.glow{box-shadow:0 0 0 5px #76ff03,0 0 40px #76ff03}
.dino{position:absolute;font-size:clamp(46px,9vmin,90px);left:4%;top:50%;transform:translate(0,-95%);transition:left .6s cubic-bezier(.3,0,.5,1),top .6s cubic-bezier(.3,-.8,.5,1.4);z-index:5;filter:drop-shadow(0 6px 4px rgba(0,0,0,.4))}
.track{position:relative;width:min(90vw,800px);height:16px;border-radius:10px;background:rgba(0,0,0,.35);border:2px solid #ffcc80;direction:ltr}
.track .fill{height:100%;border-radius:8px;background:linear-gradient(90deg,#76ff03,#ffeb3b);transition:width .6s}
.track .nest{position:absolute;right:-18px;top:-22px;font-size:34px}
.track .me{position:absolute;top:-24px;font-size:28px;transition:left .6s;transform:translateX(-50%)}
.splash{position:absolute;font-size:60px;animation:splash .8s forwards;z-index:6}
@keyframes splash{from{transform:scale(.3);opacity:1}to{transform:scale(1.6) translateY(-30px);opacity:0}}

/* ---------- 4 NIGHT ---------- */
.w-night{background:linear-gradient(180deg,#050816 0%,#0d1b4c 55%,#1a237e 100%)}
.moon{position:absolute;top:7%;left:10%;width:13vmin;height:13vmin;border-radius:50%;box-shadow:-3vmin 1vmin 0 0 #fff9c4;filter:drop-shadow(0 0 20px #fff9c4)}
.skyline{position:absolute;left:0;right:0;bottom:0;height:42%;display:flex;align-items:flex-end;gap:4px}
.bld{flex:1;background:#0a0f2c;border-top:3px solid #283593;background-image:radial-gradient(#ffeb3b 0 2px,transparent 3px);background-size:22px 26px;background-position:6px 10px;opacity:.95}
.rain{position:absolute;left:-10%;right:-10%;top:-200px;bottom:0;background:repeating-linear-gradient(105deg,transparent 0 22px,rgba(173,216,255,.12) 22px 23px);animation:rain .6s linear infinite;will-change:transform}
@keyframes rain{to{transform:translate3d(-54px,200px,0)}}
.casefile{background:#f5deb3;color:#3e2723;border:3px solid #8d6e63;border-radius:6px 20px 6px 6px;transform:rotate(-1deg);position:relative}
.casefile::before{content:"CASE FILE 🔍";position:absolute;top:-14px;left:16px;background:#c62828;color:#fff;font-size:12px;padding:2px 10px;border-radius:6px;font-weight:900;direction:ltr}
.windows{display:flex;gap:clamp(10px,2.4vw,28px);flex-wrap:wrap;justify-content:center}
.win{position:relative;width:clamp(150px,26vmin,250px);height:clamp(100px,17vmin,170px);border-radius:10px 10px 4px 4px;background:#111833;border:6px solid #3949ab;box-shadow:inset 0 0 0 3px #000,0 8px 0 #000;display:grid;place-items:center;font-weight:900;font-size:clamp(17px,3vmin,28px);direction:ltr;color:#ffeb3b;overflow:hidden}
.win::before,.win::after{content:"";position:absolute;background:#3949ab}
.win::before{left:50%;top:0;bottom:0;width:5px;transform:translateX(-50%);opacity:.6}
.win::after{top:50%;left:0;right:0;height:5px;opacity:.6}
.win span{position:relative;z-index:2;background:rgba(0,0,0,.55);padding:4px 8px;border-radius:8px}
.win.lit{background:radial-gradient(circle,#fff59d,#ffb300 70%);color:#1a237e}
.win.lit span{background:rgba(255,255,255,.7)}
.win.no{background:#37474f;color:#ff8a80}
.win .clue{position:absolute;inset:0;display:grid;place-items:center;font-size:60px;z-index:3;animation:pop .6s}
.cluebar{display:flex;gap:6px;font-size:clamp(20px,3.4vmin,30px);direction:ltr;background:rgba(0,0,0,.35);padding:4px 12px;border-radius:999px}
.cluebar i{opacity:.2;font-style:normal}.cluebar i.on{opacity:1}
.torch{position:fixed;width:240px;height:240px;border-radius:50%;pointer-events:none;background:radial-gradient(rgba(255,250,200,.35),transparent 65%);transform:translate(-50%,-50%);z-index:30;display:none}

/* ---------- 5 LAB (time machine) ---------- */
.w-lab{background:radial-gradient(ellipse at 50% 40%,#6d4c41 0%,#3e2723 55%,#1b0f0a 100%)}
.w-lab .scene::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,transparent 0 40px,rgba(255,193,7,.04) 40px 42px)}
.bgear{position:absolute;border-radius:50%;border:14px dashed #c58b45;opacity:.25;animation:gspin 14s linear infinite}
.bgear.r{animation-direction:reverse}
.machine{position:relative;width:min(95vw,980px);border-radius:28px;padding:clamp(10px,2vmin,18px);background:linear-gradient(#d7a86e,#8b5a2b);border:5px solid #4e342e;box-shadow:inset 0 0 0 4px #ffe0b2,0 12px 0 #2d1b12;text-align:center}
.screenY{display:inline-block;direction:ltr;font-family:"Courier New",monospace;font-weight:900;font-size:clamp(22px,4.5vmin,44px);color:#76ff03;background:#0b1a0b;border:4px solid #4e342e;border-radius:12px;padding:2px 18px;letter-spacing:4px;text-shadow:0 0 10px #76ff03;margin-bottom:8px}
.slots{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;direction:ltr;min-height:clamp(54px,9vmin,80px);align-items:center}
.slot{min-width:clamp(54px,10vmin,100px);height:clamp(46px,8vmin,70px);border-radius:12px;border:3px dashed #4e342e;background:rgba(0,0,0,.18);display:grid;place-items:center;font-weight:900;font-size:clamp(17px,3.3vmin,30px);color:#3e2723;padding:0 8px}
.slot.f{border-style:solid;background:#fff8e1;box-shadow:0 4px 0 #4e342e}
.machine.go{animation:warp 1.2s}
@keyframes warp{20%{transform:scale(1.03) rotate(-1deg);filter:brightness(1.5) hue-rotate(60deg)}50%{transform:scale(.97) rotate(1deg);filter:brightness(2) hue-rotate(180deg)}80%{filter:brightness(1.4) hue-rotate(300deg)}}
.blocks{display:flex;flex-wrap:wrap;gap:clamp(8px,1.6vmin,14px);justify-content:center;direction:ltr;max-width:980px}
.blk{font-weight:900;font-size:clamp(18px,3.4vmin,32px);padding:clamp(8px,1.6vmin,14px) clamp(12px,2.4vmin,22px);border-radius:14px;background:linear-gradient(#ffe082,#ffb300);color:#3e2723;border:3px solid #fff;box-shadow:0 6px 0 #8d5300;transition:transform .15s,opacity .2s}
.blk:active{transform:translateY(4px);box-shadow:0 2px 0 #8d5300}
.blk.used{opacity:0;pointer-events:none;transform:scale(.5)}
.flash{position:fixed;inset:0;background:#fff;z-index:50;pointer-events:none;animation:flash .9s forwards}
@keyframes flash{from{opacity:.95}to{opacity:0}}

/* ---------- 6 ICE ---------- */
.w-ice{background:linear-gradient(180deg,#0d1b4c 0%,#1565c0 40%,#81d4fa 70%,#e1f5fe 70.2%,#ffffff 100%)}
.aurora{will-change:transform;position:absolute;top:0;left:-20%;right:-20%;height:45%;background:linear-gradient(100deg,transparent 10%,rgba(118,255,3,.35) 30%,rgba(0,229,255,.3) 50%,rgba(213,0,249,.3) 70%,transparent 90%);filter:blur(30px);animation:aur 8s ease-in-out infinite alternate}
@keyframes aur{to{transform:translateX(10%) skewX(-10deg)}}
.snow{position:absolute;left:0;right:0;top:-180px;bottom:0;will-change:transform;background-image:radial-gradient(3px 3px at 30px 40px,#fff,transparent),radial-gradient(2px 2px at 140px 90px,#fff,transparent),radial-gradient(4px 4px at 250px 20px,#fff,transparent),radial-gradient(2px 2px at 330px 140px,#fff,transparent);background-size:360px 180px;animation:snow 6s linear infinite}
@keyframes snow{to{transform:translate3d(60px,180px,0)}}
.berg{position:absolute;bottom:28%;clip-path:polygon(0 100%,20% 30%,40% 50%,60% 0,80% 40%,100% 100%);background:linear-gradient(#fff,#b3e5fc)}
.timer{width:min(90vw,700px);height:14px;border-radius:10px;background:rgba(0,0,0,.3);overflow:hidden;border:2px solid #fff}
.timer i{display:block;height:100%;background:linear-gradient(90deg,#ff1744,#ffea00,#00e676);transition:width 1s linear;width:100%}
.ice-stage{position:relative;width:min(96vw,1000px);height:clamp(250px,48vmin,460px)}
.peng{position:absolute;left:50%;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;transition:left .55s ease-in,top .55s ease-in,transform .55s;z-index:4}
.peng .blockice{direction:ltr;background:linear-gradient(135deg,#e1f5fe,#81d4fa);color:#01579b;border:3px solid #fff;border-radius:12px;padding:8px 16px;font-weight:900;font-size:clamp(19px,3.6vmin,34px);box-shadow:0 6px 0 #0277bd;white-space:nowrap}
.peng .pb{font-size:clamp(46px,9vmin,84px);line-height:1}
.peng.slip{transform:translateX(-50%) rotate(-80deg)}
.igloos{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-around;gap:6px}
.igloo{width:clamp(80px,21vw,200px);height:clamp(80px,16vmin,150px);border-radius:120px 120px 8px 8px;background:radial-gradient(circle at 50% 100%,#455a64 0 22%,transparent 23%),repeating-linear-gradient(0deg,#fff 0 22px,#b3e5fc 22px 24px);border:3px solid #81d4fa;box-shadow:0 6px 0 #4fc3f7;display:flex;align-items:flex-start;justify-content:center;padding-top:12%;font-weight:900;color:#01579b;font-size:clamp(12px,2.3vmin,21px);line-height:1.1;text-align:center;direction:ltr}
.igloo.good{box-shadow:0 0 0 6px #00e676,0 0 40px #00e676}
.igloo.bad{box-shadow:0 0 0 6px #ff1744}
.igloo.hint{animation:pop .6s 2}

/* ---------- 7 TOWER ---------- */
.w-tower{background:linear-gradient(180deg,#311b92 0%,#8e24aa 35%,#ff6f00 75%,#ffb300 100%)}
.sunset{position:absolute;bottom:-12vmin;left:50%;width:50vmin;height:50vmin;transform:translateX(-50%);border-radius:50%;background:radial-gradient(#fff59d,#ff9100);box-shadow:0 0 120px 40px rgba(255,145,0,.5)}
.cloud{position:absolute;width:24vmin;height:7vmin;border-radius:10vmin;background:rgba(255,255,255,.35);animation:cloud 30s linear infinite}
@keyframes cloud{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
.tlay{display:flex;gap:clamp(12px,3vw,40px);align-items:center;width:100%;max-width:1150px;justify-content:center;flex:1;min-height:0}
.tower{position:relative;width:clamp(90px,15vmin,150px);height:min(62vh,560px);display:flex;flex-direction:column-reverse;flex:none}
.floor{flex:1;border:2px solid #4e342e;border-bottom:0;background:linear-gradient(90deg,#8d6e63,#bcaaa4,#8d6e63);position:relative}
.floor::after{content:"";position:absolute;left:50%;top:20%;width:24%;height:56%;transform:translateX(-50%);background:#3e2723;border-radius:10px 10px 0 0}
.floor.done{background:linear-gradient(90deg,#ffb300,#fff59d,#ffb300)}
.tower .flag{position:absolute;top:-46px;left:50%;transform:translateX(-50%);font-size:40px}
.climber{position:absolute;left:50%;transform:translate(-50%,50%);transition:bottom .7s cubic-bezier(.3,1.5,.6,1);z-index:3;width:clamp(44px,7vmin,70px)}
.qside .timer{width:100%}
.qside{flex:1;display:flex;flex-direction:column;gap:clamp(8px,1.8vmin,16px);align-items:center;min-width:0}
.shields{display:grid;grid-template-columns:1fr 1fr;gap:clamp(8px,1.6vmin,16px);width:100%;max-width:640px}
.shield{direction:ltr;font-weight:900;font-size:clamp(17px,3.2vmin,30px);padding:clamp(10px,2vmin,18px) 8px;border-radius:16px 16px 40px 40px;color:#fff;border:3px solid #fff;box-shadow:0 7px 0 rgba(0,0,0,.35)}
.shield:nth-child(1){background:linear-gradient(#ec407a,#ad1457)}
.shield:nth-child(2){background:linear-gradient(#29b6f6,#01579b)}
.shield:nth-child(3){background:linear-gradient(#66bb6a,#1b5e20)}
.shield:nth-child(4){background:linear-gradient(#ffa726,#e65100)}
.shield:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.shield.good{outline:6px solid #76ff03}
.shield.bad{filter:grayscale(1) brightness(.6)}

/* ---------- reactions & modal ---------- */
.react{position:fixed;bottom:max(60px,calc(env(safe-area-inset-bottom) + 56px));z-index:40;display:flex;align-items:flex-end;gap:4px;pointer-events:none;transform:translateY(250%);visibility:hidden;transition:transform .35s cubic-bezier(.3,1.6,.6,1),visibility 0s .35s}
.react.show{transform:translateY(0);visibility:visible;transition:transform .35s cubic-bezier(.3,1.6,.6,1)}
.react svg{width:clamp(64px,11vmin,110px);height:auto}
.react .rb{background:#fff;color:#1a237e;border-radius:16px;padding:6px 12px;font-weight:900;font-size:clamp(14px,2.4vmin,22px);margin-bottom:40%;direction:ltr;box-shadow:0 4px 10px rgba(0,0,0,.3)}
#modal{position:fixed;inset:0;z-index:60;background:rgba(10,10,40,.7);display:none;place-items:center;backdrop-filter:blur(4px)}
#modal.on{display:grid}
.mbox{background:linear-gradient(160deg,#fff,#fff3e0);color:#3e2723;border-radius:28px;padding:20px 24px;text-align:center;width:min(92vw,480px);box-shadow:0 20px 50px rgba(0,0,0,.5);border:5px solid #ffca28;animation:pop .5s}
.mbox h2{font-size:clamp(24px,4.5vmin,38px);color:#6a1b9a}
.mstars{font-size:clamp(44px,9vmin,72px);letter-spacing:6px;margin:6px 0}
.mstars span{display:inline-block;animation:starIn .5s backwards}
.mstars span:nth-child(2){animation-delay:.25s}.mstars span:nth-child(3){animation-delay:.5s}
@keyframes starIn{from{transform:scale(0) rotate(-180deg)}}
.mbox p{font-size:clamp(16px,2.6vmin,22px);font-weight:700;margin-bottom:12px}
.mbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.conf{position:fixed;top:-20px;width:12px;height:18px;z-index:70;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
/* ---------- 8 VIDEO CALL (Lesson 4) ---------- */
.c-call{background:linear-gradient(145deg,#ec407a,#00acc1)}
.w-call{background:linear-gradient(160deg,#00bcd4 0%,#7c4dff 50%,#ff4081 100%)}
.wx{position:absolute;font-size:9vmin;opacity:.35;animation:drift 14s linear infinite}
@keyframes drift{from{transform:translateX(-20vw)}to{transform:translateX(120vw)}}
.callay{display:flex;gap:clamp(12px,3vw,40px);align-items:center;justify-content:center;width:100%;max-width:1100px;flex:1;min-height:0}
.phone{position:relative;width:clamp(200px,34vmin,340px);aspect-ratio:9/16;max-height:68vh;border-radius:36px;background:#111;padding:12px;box-shadow:0 20px 40px rgba(0,0,0,.45),inset 0 0 0 3px #444;flex:none}
.phone::before{content:"";position:absolute;top:16px;left:50%;width:70px;height:16px;border-radius:10px;background:#000;transform:translateX(-50%);z-index:5}
.pscr{position:relative;width:100%;height:100%;border-radius:26px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:34px 8px 12px;transition:background .5s}
.pcaller{background:rgba(0,0,0,.4);border-radius:999px;padding:4px 12px;font-weight:900;font-size:clamp(13px,2vmin,17px);direction:ltr;display:flex;gap:6px;align-items:center}
.pcaller i{width:9px;height:9px;border-radius:50%;background:#ff1744;animation:twinkle .6s infinite alternate}
.pact{font-size:clamp(70px,14vmin,140px);filter:drop-shadow(0 8px 6px rgba(0,0,0,.35));animation:bob 1.6s ease-in-out infinite}
.pact.zoom{animation:zoomA 1.2s ease-in-out}
@keyframes zoomA{40%{transform:scale(1.5) rotate(-10deg)}70%{transform:scale(1.3) rotate(8deg)}}
.pwho{font-size:clamp(26px,4.4vmin,42px);background:rgba(255,255,255,.85);border-radius:999px;padding:2px 14px}
.pbtns{display:flex;gap:18px}.pbtns span{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:22px}
.pbtns span:first-child{background:#e53935}.pbtns span:last-child{background:#43a047}
.sc-park{background:linear-gradient(#81d4fa 55%,#66bb6a 55%)}
.sc-ice{background:linear-gradient(#b3e5fc 50%,#e1f5fe 50%)}
.sc-sea{background:linear-gradient(#4fc3f7 45%,#0277bd 45%)}
.sc-snow{background:linear-gradient(#90caf9 40%,#fff 40%)}
.sc-forest{background:linear-gradient(#a5d6a7 30%,#2e7d32 30%)}
.sc-lake{background:linear-gradient(#80deea 50%,#00838f 50%)}
.sc-q{background:radial-gradient(#b388ff,#4a148c)}
.cside{flex:1;display:flex;flex-direction:column;gap:clamp(8px,1.8vmin,16px);align-items:center;min-width:0}
.qbub{position:relative;background:#fff;color:#4a148c;border-radius:22px;padding:clamp(10px,2vmin,16px) 18px;font-weight:900;font-size:clamp(18px,3.4vmin,32px);direction:ltr;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.2)}
.abubs{display:flex;flex-direction:column;gap:clamp(8px,1.6vmin,14px);width:100%;max-width:560px}
.abub{direction:ltr;font-weight:900;font-size:clamp(18px,3.3vmin,30px);padding:clamp(10px,1.8vmin,16px) 18px;border-radius:24px 24px 24px 6px;background:linear-gradient(#69f0ae,#00c853);color:#003d1a;border:3px solid #fff;box-shadow:0 6px 0 #00701f;text-align:left;touch-action:none}
.abub:nth-child(2){background:linear-gradient(#80d8ff,#0091ea);color:#002f6c;box-shadow:0 6px 0 #01579b}
.abub:nth-child(3){background:linear-gradient(#ffd180,#ff9100);color:#4e2600;box-shadow:0 6px 0 #a64b00}
.abub:active{transform:translateY(4px)}
.abub.good{outline:6px solid #fff;filter:brightness(1.1)}
.abub.bad{filter:grayscale(1) brightness(.7)}
@media (orientation:portrait){.callay{flex-direction:column}.phone{width:clamp(150px,40vw,220px);max-height:38vh}}
/* ---------- polish ---------- */
.en{unicode-bidi:isolate}
.screen.on{animation:scrIn .4s ease-out}
@keyframes scrIn{from{opacity:0;transform:scale(1.03)}}
.wcard{animation:enterUp .55s cubic-bezier(.2,1.4,.4,1) backwards}
.wcard:nth-child(2){animation-delay:.06s}.wcard:nth-child(3){animation-delay:.12s}.wcard:nth-child(4){animation-delay:.18s}.wcard:nth-child(5){animation-delay:.24s}.wcard:nth-child(6){animation-delay:.3s}.wcard:nth-child(7){animation-delay:.36s}.wcard:nth-child(8){animation-delay:.42s}
.stamp,.abub,.shield,.blk,.win,.igloo,.rock.a,.rock.b{animation:enterUp .5s cubic-bezier(.2,1.4,.4,1) backwards}
:is(.stamp,.abub,.shield,.blk,.win,.igloo):nth-child(2){animation-delay:.08s}
:is(.stamp,.abub,.shield,.blk,.win,.igloo):nth-child(3){animation-delay:.16s}
:is(.stamp,.abub,.shield,.blk,.win,.igloo):nth-child(4){animation-delay:.24s}
:is(.blk):nth-child(n+5){animation-delay:.3s}
.rock.b{animation-delay:.1s}
@keyframes enterUp{from{opacity:0;transform:translateY(40px) scale(.7)}}
.cardIn{animation:cardIn .5s cubic-bezier(.2,1.3,.4,1)}
@keyframes cardIn{from{opacity:0;transform:translateY(-24px) scale(.92)}}
.abub,.shield,.blk,.stamp{position:relative;transition:transform .18s cubic-bezier(.3,1.6,.5,1),box-shadow .18s,filter .2s}
.abub::after,.shield::after,.blk::after,.igloo::after{content:"";position:absolute;left:7%;right:7%;top:4px;height:42%;border-radius:20px 20px 40px 40px;background:linear-gradient(rgba(255,255,255,.5),rgba(255,255,255,0));pointer-events:none}
.igloo{position:relative}
.card,.qbub,.crate{box-shadow:0 8px 0 rgba(0,0,0,.18),0 18px 30px rgba(0,0,0,.18)}
@media (hover:hover){.abub:hover,.shield:hover,.blk:hover,.stamp:hover,.win:hover,.igloo:hover,button.rock:hover{transform:translateY(-4px) scale(1.03)}}
.gbtn,.score{transition:transform .2s}.gbtn:active{transform:scale(.9)}
/* ---------- touch & FX ---------- */
.abub,.stamp,.blk,.shield,.dino,.peng,.wheel,.win{touch-action:none}
.dino,.peng{cursor:grab}
.dragging{opacity:.35!important;transform:scale(.92)}
.ghost{filter:drop-shadow(0 18px 18px rgba(0,0,0,.45));transition:none}
.dropover{outline:5px dashed #ffeb3b!important;outline-offset:6px;animation:pulseD .6s infinite alternate}
@keyframes pulseD{to{outline-color:#fff}}
.ripple{position:fixed;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;border:3px solid rgba(255,255,255,.9);pointer-events:none;z-index:90;animation:rip .55s ease-out forwards}
@keyframes rip{to{transform:scale(6);opacity:0}}
.spark{position:fixed;pointer-events:none;z-index:85;font-size:18px;animation:sparkA .7s ease-out forwards}
@keyframes sparkA{to{transform:translateY(-30px) scale(.2) rotate(180deg);opacity:0}}
.part{will-change:transform,opacity;position:fixed;pointer-events:none;z-index:86;font-size:clamp(20px,3.6vmin,36px);transition:transform .9s cubic-bezier(.15,.8,.3,1),opacity .9s ease-in}
.flystar{position:fixed;pointer-events:none;z-index:87;font-size:36px;transition:transform .8s cubic-bezier(.5,-.4,.6,1),opacity .2s .7s}
.vign{position:fixed;inset:0;pointer-events:none;z-index:84;box-shadow:inset 0 0 120px 40px rgba(255,0,40,.65);animation:flash .7s forwards}
.goodglow{position:fixed;inset:0;pointer-events:none;z-index:84;box-shadow:inset 0 0 120px 30px rgba(118,255,3,.45);animation:flash .7s forwards}
.combo{position:fixed;left:50%;top:38%;z-index:88;pointer-events:none;font-weight:900;font-size:clamp(34px,8vmin,80px);color:#fff;-webkit-text-stroke:3px #ff6d00;text-shadow:0 6px 0 #bf360c,0 0 30px #ffea00;direction:ltr;white-space:nowrap;animation:comboA 1.2s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes comboA{0%{transform:translate(-50%,-50%) scale(0) rotate(-20deg)}30%{transform:translate(-50%,-50%) scale(1.15) rotate(4deg)}70%{transform:translate(-50%,-50%) scale(1) rotate(0);opacity:1}100%{transform:translate(-50%,-90%) scale(.9);opacity:0}}
.bigshake{animation:bshake .4s}
@keyframes bshake{20%{transform:translate(-8px,4px)}40%{transform:translate(8px,-4px)}60%{transform:translate(-6px,-3px)}80%{transform:translate(6px,3px)}}
#arena>.dark{position:absolute;inset:0;z-index:4;pointer-events:none;background:radial-gradient(circle at var(--x,50%) var(--y,62%),rgba(255,250,200,.18) 0,transparent 95px,rgba(2,4,20,.94) 165px);transition:opacity .5s}
#arena>.dark.off{opacity:.15}
#arena #nq,#arena>.hint,#arena>.cluebar{z-index:6}
#arena>.dhint{position:absolute;bottom:max(60px,calc(env(safe-area-inset-bottom) + 56px));left:50%;transform:translateX(-50%);z-index:6;font-weight:800;font-size:clamp(13px,2vmin,18px);background:rgba(0,0,0,.45);padding:4px 14px;border-radius:999px;max-width:92vw;text-align:center;animation:bob 2s infinite}
@media (orientation:portrait){
 .fline{flex-direction:column-reverse;align-items:center}
 .robot{width:clamp(80px,22vw,140px)}
 .tlay{flex-direction:row}
 .tower{height:min(52vh,460px)}
 .worlds{padding-left:12px;padding-right:12px}
}
@media (max-height:520px) and (orientation:landscape){.mascots svg{width:70px}.bubble{display:none}.worlds{padding-bottom:60px}}

.bgi-vault{background-image:linear-gradient(rgba(0,0,20,.10),rgba(0,0,20,.30)),url(a/0861b6d2f0.webp)!important;background-size:cover!important;background-position:center!important}
.bgi-lava{background-image:linear-gradient(rgba(0,0,20,.10),rgba(0,0,20,.30)),url(a/316df2673e.webp)!important;background-size:cover!important;background-position:center!important}

.bgi-ice{background-image:linear-gradient(rgba(0,0,20,.10),rgba(0,0,20,.30)),url(a/412a02147a.webp)!important;background-size:cover!important;background-position:center!important}
.bgi-lab{background-image:linear-gradient(rgba(0,0,20,.10),rgba(0,0,20,.30)),url(a/72ba68ffbb.webp)!important;background-size:cover!important;background-position:center!important}
.bgi-tower{background-image:linear-gradient(rgba(0,0,20,.10),rgba(0,0,20,.30)),url(a/67fe3a18d2.webp)!important;background-size:cover!important;background-position:center!important}
.has-bg .scene>*:not(.rain):not(.snow){display:none}
#home.bgi-home .stars{display:none}#home .clockring{opacity:.35}

.lbanner{height:clamp(120px,24vmin,220px);border-radius:22px;margin-bottom:12px;box-shadow:0 8px 20px rgba(0,0,0,.15)}
.robot{width:clamp(90px,16vmin,170px)!important}
.rimg{position:relative;width:100%}

.rimg .base{opacity:.3;filter:grayscale(1) brightness(1.5)}

.dino{font-size:0!important}.dino img{width:clamp(70px,12vmin,120px);height:auto;display:block;pointer-events:none}

.catwin{position:absolute;left:50%;top:50%;width:min(50vmin,360px);transform:translate(-50%,-50%);z-index:9;animation:catIn 1s cubic-bezier(.2,1.5,.4,1);filter:drop-shadow(0 10px 30px rgba(255,235,59,.6))}

.treasure img{width:min(34vmin,260px);height:auto;display:block;margin:0 auto}
.w-tower.has-bg .tlay{flex-direction:row-reverse}
.has-bg .hint{background:rgba(0,0,0,.45);padding:4px 14px;border-radius:999px}
#splash{position:fixed;inset:0;z-index:95;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
