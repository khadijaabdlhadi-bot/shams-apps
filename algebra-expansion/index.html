<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="copyright" content="© مدرسة شمس الوطن. جميع الحقوق محفوظة.">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مراجعة المفكوك الجبري — مدرسة شمس الوطن</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Noto+Kufi+Arabic:wght@600;800&family=STIX+Two+Text:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout concept: a graph-paper worksheet. One ruled column, sticky progress bar, and the colored area diagrams as the bold moment.
   Color: paper, ink, accent blue, and three term colors (k1 blue, k2 teal, k3 orange) reused in diagrams, formulas and steps.
   Type: Noto Kufi Arabic for headings, IBM Plex Sans Arabic for text, STIX Two + Amiri for math. */
:root{
  --paper:#F2F5FB; --card:#FFFFFF; --ink:#14213D; --muted:#56637E; --line:#D5DDEB; --grid:#E5EBF5;
  --accent:#2750B8; --accent-ink:#FFFFFF; --soft:#E8EEFB;
  --k1:#2F5FD0; --k2:#0B7F71; --k3:#C4551A;
  --good:#17784A; --bad:#B93232; --good-bg:#E3F4EB; --bad-bg:#FBE8E8; --hl:#FFE79A;
  --f-display:'Noto Kufi Arabic','IBM Plex Sans Arabic',system-ui,sans-serif;
  --f-body:'IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  --f-math:'STIX Two Text','Amiri','Times New Roman',serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1527; --card:#161F38; --ink:#E7ECF8; --muted:#9AA6C2; --line:#2A3757; --grid:#141D34;
    --accent:#86A8FF; --accent-ink:#0E1527; --soft:#1B2747;
    --k1:#86A8FF; --k2:#3FD4C0; --k3:#FF9C60;
    --good:#4CD08B; --bad:#FF8383; --good-bg:#12301F; --bad-bg:#3A1B20; --hl:#5B4B05;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1527; --card:#161F38; --ink:#E7ECF8; --muted:#9AA6C2; --line:#2A3757; --grid:#141D34;
  --accent:#86A8FF; --accent-ink:#0E1527; --soft:#1B2747;
  --k1:#86A8FF; --k2:#3FD4C0; --k3:#FF9C60;
  --good:#4CD08B; --bad:#FF8383; --good-bg:#12301F; --bad-bg:#3A1B20; --hl:#5B4B05;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background-color:var(--paper); color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.7;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:30}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--f-display);line-height:1.35;margin:0;text-wrap:balance}
p{margin:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}

/* math */
.m{unicode-bidi:isolate;direction:ltr;font-family:var(--f-math);font-size:1.12em;white-space:nowrap}
.v{unicode-bidi:isolate;font-family:var(--f-math)}
.m sup{font-size:.7em;line-height:0;position:relative;top:-.55em;vertical-align:baseline;margin-left:1px}
.k1{color:var(--k1)} .k2{color:var(--k2)} .k3{color:var(--k3)}
.fx{overflow-x:auto;padding-block:2px;direction:ltr;text-align:left}
.calc,.fbox,.pv{direction:ltr;text-align:left}
.calc .m,.fbox .m,.stp .m,.fb .m{white-space:normal}
.big .m{font-size:1.5em}

/* logo */
.logo-sm{height:38px;width:auto;border-radius:8px;background:#fff;display:block}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap}
.prog span{white-space:nowrap}
@media (max-width:480px){.top .bar{width:44px}.prog{gap:6px;font-size:.8rem}.brand{font-size:.95rem}.logo-sm{height:32px}}
.hero-logo{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:6px}
.hero-logo img{height:96px;width:auto;max-width:100%;border-radius:14px;background:#fff;padding:4px;border:1px solid var(--line)}
.hero-logo span{font-family:var(--f-display);font-weight:600;color:var(--muted);font-size:.95rem}
.sign{display:flex;flex-direction:column;align-items:center;gap:12px;color:var(--muted);font-size:.88rem;padding-top:16px;border-top:1px dashed var(--line)}
.sign-school{display:flex;align-items:center;gap:10px}
.sign-school img{height:34px;width:auto;border-radius:8px;background:#fff}
.sign .sig{width:min(300px,80%);height:auto}
/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));background:var(--card);border-bottom:1px solid var(--line)}
.top-in{max-width:820px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{background:none;border:0;padding:6px 0;font-family:var(--f-display);font-weight:800;font-size:1.05rem;color:var(--ink)}
.prog{display:flex;align-items:center;gap:10px;font-size:.85rem;color:var(--muted)}
.bar{width:110px;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.wrap{max-width:820px;margin:auto;padding-block:22px 56px;display:flex;flex-direction:column;gap:18px}

/* home */
.hero{padding:26px 0 6px}
.hero h1{font-size:clamp(1.9rem,6vw,2.8rem);font-weight:800}
.hero p{color:var(--muted);max-width:56ch;margin-top:10px}
.hero .row{margin-top:18px}
.eyebrow{font-family:var(--f-display);font-size:.8rem;letter-spacing:.04em;color:var(--accent);font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.lc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:start;display:flex;flex-direction:column;gap:10px;min-width:0;transition:transform .15s,border-color .15s}
.lc:hover{transform:translateY(-2px);border-color:var(--accent)}
.lc .n{font-family:var(--f-display);font-weight:800;font-size:2rem;line-height:1;color:var(--accent)}
.lc h3{font-size:1.05rem}
.lc .pv{color:var(--muted);font-size:.92rem;overflow-x:auto}
.pill{display:inline-block;font-size:.78rem;padding:2px 10px;border-radius:99px;background:var(--soft);color:var(--accent);font-weight:600;align-self:flex-start}
.pill.ok{background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--hl);color:var(--ink)}
.exam-card{background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:20px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;border:0;text-align:start;width:100%}
.exam-card h3{font-size:1.2rem}
.exam-card p{opacity:.9;font-size:.95rem}
.exam-card .go{background:var(--accent-ink);color:var(--accent);border-radius:10px;padding:10px 18px;font-weight:600}
.cheat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 16px}
.cheat .r{display:grid;grid-template-columns:minmax(110px,160px) 1fr;gap:6px 14px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.cheat .r:last-child{border:0}
.cheat .r b{font-weight:600;font-size:.92rem}
@media (max-width:560px){.cheat .r{grid-template-columns:1fr}}

/* lesson */
.crumb{display:flex;gap:8px;align-items:center;font-size:.88rem;color:var(--muted)}
.lnk{background:none;border:0;padding:4px 0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.l-head{display:flex;gap:14px;align-items:center}
.l-n{flex:none;width:58px;height:58px;border-radius:14px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.8rem}
.l-head h1{font-size:clamp(1.5rem,5vw,2.1rem);font-weight:800}
.sub{color:var(--muted)}
.sec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.sec>h2{font-size:1.1rem;display:flex;align-items:center;gap:10px}
.sec>h2::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--accent)}
.hint{color:var(--muted);font-size:.95rem}
.rule{display:flex;flex-direction:column;gap:12px}
.fbox{background:var(--soft);border-radius:10px;padding:12px 14px;overflow-x:auto}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.chip{background:var(--soft);border-radius:10px;padding:8px 10px;text-align:center;font-size:.92rem}
.hl{background:var(--hl);padding:0 4px;border-radius:4px}

.viz{display:flex;flex-direction:column;gap:12px}
.ctrls{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 18px}
.sl{display:flex;align-items:center;gap:10px}
.sl-l{min-width:28px;font-weight:600}
.sl input{flex:1;min-width:0;accent-color:var(--accent);height:28px}
.sl output{min-width:1.6em;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;align-self:flex-start;background:var(--card)}
.seg button{border:0;background:none;padding:8px 14px;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.diag{display:grid;place-items:center;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px;min-height:120px}
.svg{width:100%;max-width:460px;height:auto;direction:ltr}
.svg text{font-family:var(--f-body)}
.calc{overflow-x:auto;background:var(--soft);border-radius:10px;padding:10px 14px}
.reg{stroke-width:1.5}
.r1{fill:color-mix(in srgb,var(--k1) 26%,var(--card));stroke:var(--k1)}
.r2{fill:color-mix(in srgb,var(--k2) 26%,var(--card));stroke:var(--k2)}
.r3{fill:color-mix(in srgb,var(--k3) 26%,var(--card));stroke:var(--k3)}
.rm{fill:color-mix(in srgb,var(--k3) 22%,var(--card));stroke:var(--k3)}
.rm2{fill:color-mix(in srgb,var(--k3) 55%,var(--card));stroke:var(--k3)}
.cut{fill:none;stroke:var(--k3);stroke-width:2;stroke-dasharray:5 4}
.ug{stroke:var(--card);stroke-width:1;opacity:.75}
.rl{font-size:15px;font-weight:600;fill:var(--ink);font-family:var(--f-math)}
.dl{font-size:13px;font-weight:600;fill:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.88rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:4px;border:1.5px solid;display:inline-block}
.sw.r1{background:color-mix(in srgb,var(--k1) 26%,var(--card));border-color:var(--k1)}
.sw.r2{background:color-mix(in srgb,var(--k2) 26%,var(--card));border-color:var(--k2)}
.sw.r3,.sw.rm{background:color-mix(in srgb,var(--k3) 26%,var(--card));border-color:var(--k3)}
.sw.rm2{background:color-mix(in srgb,var(--k3) 55%,var(--card));border-color:var(--k3)}
.cf1{fill:color-mix(in srgb,var(--k1) 30%,var(--card));stroke:var(--k1)}
.cf2{fill:color-mix(in srgb,var(--k2) 30%,var(--card));stroke:var(--k2)}
.cf3{fill:color-mix(in srgb,var(--k3) 30%,var(--card));stroke:var(--k3)}
.cl{stroke:var(--ink);stroke-width:.7;opacity:.35}
.twin{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:620px){.twin{grid-template-columns:1fr}}
.tool{border:1px dashed var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.tool h3{font-size:.98rem}
.cubes{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.cubes span{flex:none;background:var(--soft);border-radius:8px;padding:4px 10px;font-size:.88rem;font-variant-numeric:tabular-nums}

.stp{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;counter-reset:s}
.stp li{counter-increment:s;background:var(--soft);border-radius:10px;padding:10px 14px 10px 14px;display:flex;flex-direction:column;gap:2px;position:relative;padding-inline-start:46px;min-width:0}
.stp li::before{content:counter(s);position:absolute;inset-inline-start:12px;top:10px;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:.8rem;font-weight:600;display:grid;place-items:center}
.stp li.new{animation:pop .35s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.stp li.new{animation:none}.bar i,.lc{transition:none}}
.stp b{font-weight:600;font-size:.95rem}
.row{display:flex;flex-wrap:wrap;gap:10px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 16px;min-height:44px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn:disabled{opacity:.45;cursor:default}

.mis{display:grid;gap:8px}
.mis .it{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center;padding:10px 12px;border-radius:10px}
.mis .w{background:var(--bad-bg)} .mis .g{background:var(--good-bg)}
.tag{font-size:.78rem;font-weight:600;padding:1px 9px;border-radius:99px;color:#fff}
.w .tag{background:var(--bad)} .g .tag{background:var(--good)}
.mis .it>div{overflow-x:auto;display:flex;flex-wrap:wrap;gap:2px 12px;align-items:center;min-width:0}

/* quiz */
.quiz{display:flex;flex-direction:column;gap:12px}
.q-head{display:flex;justify-content:space-between;align-items:center;font-size:.9rem;color:var(--muted)}
.dots{display:flex;gap:5px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.cur{background:var(--accent)} .dots i.ok{background:var(--good)} .dots i.no{background:var(--bad)}
.q-topic{font-size:.8rem;color:var(--accent);font-weight:600}
.q-text{font-size:1.08rem;font-weight:500;overflow-x:auto}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.opt{display:flex;align-items:center;gap:10px;text-align:start;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;min-height:52px;min-width:0}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:.82rem;font-weight:600}
.opt .ot{overflow-x:auto;min-width:0}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default;color:inherit}
.fb{border-radius:12px;padding:12px 14px;background:var(--soft);display:flex;flex-direction:column;gap:6px;font-size:.96rem}
.fb .g{color:var(--good);font-weight:600} .fb .r{color:var(--bad);font-weight:600}
.done{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.score{font-family:var(--f-display);font-size:2.6rem;font-weight:800;line-height:1}
.score small{font-size:1.1rem;color:var(--muted);font-weight:600}
.nav2{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* result */
.res-top{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.ring{width:130px;height:130px}
.ring text{font-family:var(--f-display);font-weight:800;font-size:26px;fill:var(--ink)}
.tb{display:grid;gap:10px}
.tb .t{display:grid;grid-template-columns:150px 1fr auto;gap:10px;align-items:center;font-size:.92rem}
.tb .bar{width:100%}
.tb .bar i.lo{background:var(--bad)} .tb .bar i.hi{background:var(--good)}
@media (max-width:520px){.tb .t{grid-template-columns:1fr auto}.tb .t .bar{grid-column:1/-1;order:3}}
.miss{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--card)}
.miss .a{display:flex;gap:8px;flex-wrap:wrap;align-items:center;overflow-x:auto}
</style>
</head>
