<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="copyright" content="© مدرسة شمس الوطن. جميع الحقوق محفوظة.">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shams Phonics Star</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Baloo+Bhaijaan+2:wght@500;700;800&family=Aref+Ruqaa:wght@700&display=swap">
<style>
/* Playful sky world: sun in the corner, drifting clouds, chunky 3D buttons. One bright theme by choice (kids' classroom app). */
:root{
  --ink:#1E2A3A; --paper:#FFFFFF; --muted:#5D6B7D; --sky:#EAF7FF;
  --sun:#FFC83D; --sun-deep:#F29A00; --teal:#14A3A3; --teal-deep:#0B7A7A;
  --good:#2EAD5B; --bad:#E4524A; --pink:#FF6FA8; --violet:#8E5CF0;
  --display:"Fredoka",system-ui,sans-serif; --ar:"Baloo Bhaijaan 2","Tajawal","Segoe UI",Tahoma,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#BFE9FF}
body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--display);font-size:18px;
  background:linear-gradient(180deg,#86D6FF 0%,#C4EDFF 40%,#FFF4D2 100%) fixed;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:12px 90px;overflow-x:hidden}
.sky{position:fixed;inset:0;pointer-events:none;z-index:-1;overflow:hidden}
.sky .sunb{position:absolute;top:-70px;right:-70px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,#FFE680 0 45%,#FFC83D 46% 60%,rgba(255,200,61,0) 61%);animation:spin 40s linear infinite}
.sky .sunb::before{content:"";position:absolute;inset:-40px;border-radius:50%;background:repeating-conic-gradient(rgba(255,214,90,.55) 0 8deg,transparent 8deg 22deg);mask:radial-gradient(circle,transparent 45%,#000 46%);-webkit-mask:radial-gradient(circle,transparent 45%,#000 46%)}
.sky .cl{position:absolute;width:140px;height:44px;background:#fff;border-radius:44px;opacity:.85;animation:drift linear infinite}
.sky .cl::before,.sky .cl::after{content:"";position:absolute;background:#fff;border-radius:50%}
.sky .cl::before{width:60px;height:60px;top:-28px;left:22px}.sky .cl::after{width:46px;height:46px;top:-18px;left:70px}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button{font-family:inherit;cursor:pointer;border:0;color:inherit;touch-action:manipulation}
button:focus-visible{outline:4px solid var(--violet);outline-offset:3px}

/* header */
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px}
.logo img{height:60px;width:auto;filter:drop-shadow(0 3px 4px rgba(0,0,0,.15))}
.ttl{font-size:30px;font-weight:700;line-height:1;letter-spacing:.5px}
.ttl i{font-style:normal;display:inline-block;animation:bob 2.4s ease-in-out infinite}
.ttl .sub{display:block;font-family:var(--ar);font-size:14px;font-weight:700;color:var(--teal-deep);margin-top:4px;direction:rtl;text-align:left}
.tools{display:flex;gap:8px;align-items:center}
.pill{background:var(--paper);border-radius:999px;padding:8px 14px;font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;box-shadow:0 4px 0 rgba(30,42,58,.12)}
.ib{width:46px;height:46px;border-radius:50%;background:var(--paper);font-size:22px;display:grid;place-items:center;box-shadow:0 4px 0 rgba(30,42,58,.12)}

/* bilingual text */
.t-en{display:block}
.t-ar{display:block;font-family:var(--ar);direction:rtl;font-weight:700;color:var(--teal-deep);font-size:.85em;margin-top:2px}
.arb{font-family:var(--ar);direction:rtl}
body.en-only .t-ar:not(.keep){display:none}
.arsw{font-family:var(--ar);font-weight:800;font-size:24px;color:var(--muted);position:relative}
.arsw::after{content:"";position:absolute;width:30px;height:3px;background:var(--bad);border-radius:3px;transform:rotate(-40deg)}
.arsw.on{background:var(--teal);color:#fff}.arsw.on::after{display:none}

/* chunky buttons */
.btn{--b:var(--teal);--d:var(--teal-deep);background:var(--b);color:#fff;border-radius:999px;padding:12px 26px;font-size:21px;font-weight:700;box-shadow:0 6px 0 var(--d);transition:transform .08s,box-shadow .08s;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--d)}
.btn.sun{--b:var(--sun);--d:var(--sun-deep);color:var(--ink)}
.btn.soft{--b:#fff;--d:#C9DCE8;color:var(--ink)}
.btn.pink{--b:var(--pink);--d:#D9407E}
.home-b{width:52px;height:52px;border-radius:50%;background:var(--sun);font-size:24px;box-shadow:0 5px 0 var(--sun-deep);flex:none}
.home-b:active{transform:translateY(3px);box-shadow:0 2px 0 var(--sun-deep)}

/* welcome */
.welcome{background:var(--paper);border-radius:32px;padding:24px 20px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;box-shadow:0 10px 0 rgba(30,42,58,.08)}
.welcome .big-logo{width:min(200px,50vw)}
.welcome h1{margin:0;font-size:clamp(36px,8vw,54px);line-height:1}
.welcome h1 i{font-style:normal;display:inline-block;animation:bob 2.4s ease-in-out infinite}
.duo{display:flex;gap:8px;align-items:flex-end;justify-content:center}
.duo svg,.duo img{width:min(140px,34vw);height:auto;animation:bob 2s ease-in-out infinite}
.duo svg:last-child{animation-delay:-1s}
.duo .nm{font-family:var(--ar);font-weight:800;font-size:18px;color:var(--sun-deep)}
.langs{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:560px}
.lang{background:var(--sky);border-radius:24px;padding:18px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;border:4px solid transparent;box-shadow:0 6px 0 #C9DCE8;font-weight:700;font-size:22px}
.lang .e{font-size:44px}
.lang.on{border-color:var(--teal);background:#E2FAF6}
.sig{font-family:"Aref Ruqaa",var(--ar);font-size:26px;color:var(--teal-deep);direction:rtl;line-height:1.3}
.sig small{display:block;font-family:var(--ar);font-size:14px;color:var(--muted);font-weight:700}

/* home */
.hero{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#FFD84D,#FFB21E);border-radius:30px;padding:14px 18px;box-shadow:0 8px 0 var(--sun-deep);text-align:left;width:100%}
.hero:active{transform:translateY(4px);box-shadow:0 4px 0 var(--sun-deep)}
.hero img{width:86px;height:86px;border-radius:22px;object-fit:cover;flex:none;border:4px solid #fff}
.hero b{display:block;font-size:clamp(24px,5vw,32px)}
.hero .play{margin-left:auto;width:64px;height:64px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:30px;color:var(--sun-deep);flex:none;animation:pulse 1.6s ease-in-out infinite}
.sec{display:flex;align-items:center;gap:10px;margin-top:6px}
.sec h3{margin:0;font-size:26px}
.sec .cnt{background:#fff;border-radius:999px;padding:2px 12px;font-weight:700;font-size:16px}
.grp{background:rgba(255,255,255,.55);border-radius:26px;padding:12px}
.grp .gl{font-weight:700;font-size:16px;color:var(--teal-deep);margin:0 4px 8px;display:flex;gap:8px;align-items:center}
.sounds{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.snd{background:var(--paper);border-radius:22px;padding:8px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;box-shadow:0 6px 0 var(--c);transition:transform .15s}
.snd:hover{transform:translateY(-4px) rotate(-1deg)}
.snd:active{transform:translateY(3px);box-shadow:0 3px 0 var(--c)}
.snd img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:16px;background:var(--sky)}
.snd b{font-size:24px;color:var(--c);letter-spacing:.5px}
.snd .ok{position:absolute;top:-6px;right:-6px;width:32px;height:32px;border-radius:50%;background:var(--good);color:#fff;display:grid;place-items:center;font-size:18px;font-weight:700;border:3px solid #fff}
.snd.cur{outline:4px dashed var(--sun-deep);outline-offset:3px}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.tile{background:linear-gradient(150deg,var(--c),var(--c2));color:#fff;border-radius:26px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:2px;box-shadow:0 7px 0 var(--d);position:relative;overflow:hidden;min-height:150px}
.tile:active{transform:translateY(4px);box-shadow:0 3px 0 var(--d)}
.tile .ic{font-size:50px;line-height:1;animation:bob 2.6s ease-in-out infinite;filter:drop-shadow(0 4px 2px rgba(0,0,0,.15))}
.tile b{font-size:23px;margin-top:6px}
.tile .t-ar{color:#fff;opacity:.95}
.tile .best{font-size:16px;letter-spacing:2px;margin-top:auto}
.tile::after{content:"";position:absolute;right:-30px;bottom:-30px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.15)}

/* screens */
.card{background:var(--paper);border-radius:30px;padding:18px;display:flex;flex-direction:column;gap:16px;box-shadow:0 10px 0 rgba(30,42,58,.08)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.top>div{flex:1;min-width:0}
.top h2{margin:0;font-size:clamp(22px,5vw,28px);text-wrap:balance}
.guide{background:#FFF4C7;border-radius:20px;padding:10px 14px;text-align:center;font-size:19px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px}
.guide .t-ar{font-size:17px}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{background:var(--sky);padding:10px 16px;border-radius:999px;font-weight:700;font-size:17px;box-shadow:0 4px 0 #C9DCE8}
.chip.on{background:var(--teal);color:#fff;box-shadow:0 4px 0 var(--teal-deep)}

/* learn */
.learn{display:grid;grid-template-columns:minmax(0,270px) minmax(0,1fr);gap:18px;align-items:start}
.cardbtn{background:none;padding:0;border-radius:22px;position:relative}
.cardbtn img{width:100%;border-radius:22px;box-shadow:0 8px 0 var(--c);display:block}
.cardbtn .tap{position:absolute;bottom:10px;right:10px;background:var(--sun);border-radius:999px;padding:6px 12px;font-weight:700;font-size:16px;box-shadow:0 3px 0 var(--sun-deep);animation:pulse 1.6s infinite}
.side{display:flex;flex-direction:column;gap:12px}
.gr{display:flex;gap:8px;flex-wrap:wrap}
.gr span{font-size:52px;font-weight:700;background:var(--sky);border-radius:20px;padding:0 18px;color:var(--c);box-shadow:0 5px 0 #C9DCE8}
.act{background:#E6F8EE;border-radius:20px;padding:12px 14px;display:flex;gap:10px;align-items:center;font-size:19px;font-weight:600}
.act .tx{flex:1}
.hear{background:var(--sun);color:var(--ink);width:56px;height:56px;border-radius:50%;font-size:24px;box-shadow:0 5px 0 var(--sun-deep);flex:none}
.hear.wide{width:auto;padding:0 22px;border-radius:999px;font-weight:700;font-size:20px}
.hear:active{transform:translateY(3px);box-shadow:0 2px 0 var(--sun-deep)}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.word{background:var(--sky);border-radius:20px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .2s,background .2s;box-shadow:0 5px 0 #C9DCE8}
.word .e{font-size:46px;line-height:1.1}
.word .t{font-size:26px;font-weight:600;letter-spacing:.5px}
.word.lit{background:#FFE37A;transform:scale(1.07) rotate(-2deg)}
.hl{color:var(--c);font-weight:700;text-decoration:underline;text-decoration-thickness:4px;text-underline-offset:5px}
@media (max-width:600px){.learn{grid-template-columns:1fr}.cardbtn{max-width:240px;margin:0 auto}}

/* quiz */
.bar{height:16px;background:var(--sky);border-radius:999px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#FFD84D,#FF9F1C);border-radius:999px;transition:width .4s}
.q{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.q .big{font-size:96px;line-height:1;animation:bob 2s ease-in-out infinite}
.q .pic{width:min(240px,60vw);aspect-ratio:1;border-radius:26px;object-fit:cover;box-shadow:0 7px 0 #C9DCE8}
.q .prompt{font-size:52px;font-weight:700;letter-spacing:3px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.opt{background:var(--sky);border-radius:22px;padding:16px 6px;font-size:32px;font-weight:700;color:var(--ink);border:4px solid transparent;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;box-shadow:0 6px 0 #C9DCE8;transition:transform .1s}
.opt:active{transform:translateY(3px)}
.opt .e{font-size:54px;line-height:1.1}
.opt .t{font-size:20px;font-weight:600}
.opt.right{border-color:var(--good);background:#DFF7E7;animation:pop .45s}
.opt.wrong{border-color:var(--bad);background:#FDE4E2;animation:shake .4s}
.fb{min-height:34px;text-align:center;font-size:24px;font-weight:700}

/* balloons */
.hud{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-weight:700;font-size:21px;font-variant-numeric:tabular-nums}
.target{display:flex;align-items:center;gap:12px;background:var(--sky);border-radius:20px;padding:8px 14px 8px 8px}
.target img{width:64px;height:64px;border-radius:16px;object-fit:cover}
.target b{font-size:36px;color:var(--teal-deep)}
.arena{position:relative;height:min(62vh,540px);border-radius:26px;overflow:hidden;background:linear-gradient(#8FD8FF,#DDF4FF 70%,#BFE8A8);touch-action:manipulation}
.arena .hill{position:absolute;bottom:-60px;width:60%;height:140px;border-radius:50%;background:#8BD06A}
.bal{position:absolute;left:0;top:0;width:116px;height:140px;padding:0;background:none;will-change:transform}
.bal .bb{width:116px;height:120px;border-radius:50% 50% 46% 46%;background:var(--bc);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;box-shadow:inset -12px -14px 0 rgba(0,0,0,.12),inset 10px 10px 0 rgba(255,255,255,.28)}
.bal .bb .e{font-size:40px;line-height:1}
.bal .bb .t{font-size:21px;font-weight:700;text-shadow:0 2px 2px rgba(0,0,0,.25)}
.bal .str{display:block;width:2px;height:20px;background:#6B7A8C;margin:0 auto}
.bal.popd .bb{animation:burst .3s forwards}
.bal.no .bb{animation:shake .4s}
.over{position:absolute;inset:0;display:grid;place-items:center;background:rgba(234,247,255,.9);text-align:center;padding:10px}

/* memory */
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mc{display:block;position:relative;width:100%;aspect-ratio:1;border-radius:18px;perspective:600px;padding:0;background:none}
.mc .in{position:absolute;inset:0;transition:transform .45s;transform-style:preserve-3d}
.mc.f .in,.mc.m .in{transform:rotateY(180deg)}
.mc .fa,.mc .ba{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;overflow:hidden}
.mc .fa{background:radial-gradient(circle at 35% 30%,#FFE680,#FFB21E);box-shadow:inset 0 -7px 0 var(--sun-deep)}
.mc .fa svg{width:62%;height:auto}
.mc .ba{transform:rotateY(180deg);background:var(--sky);font-size:clamp(20px,5vw,34px);font-weight:700;text-align:center;line-height:1.1}
.mc .ba img{width:100%;height:100%;object-fit:cover}
.mc.m .ba{outline:5px solid var(--good);outline-offset:-5px}
@media (max-width:420px){.mem{grid-template-columns:repeat(3,1fr)}.opts{gap:8px}.opt{font-size:26px}.opt .e{font-size:44px}.q .big{font-size:76px}.q .prompt{font-size:42px}}

/* table */
.table{overflow-x:auto}
table{border-collapse:separate;border-spacing:6px;margin:0 auto}
th{color:var(--muted);font-size:20px}
td button{background:var(--sky);border-radius:14px;padding:6px 8px;min-width:76px;color:var(--ink);font-size:16px;line-height:1.2;box-shadow:0 3px 0 #C9DCE8}
td button b{display:block;font-size:21px;color:var(--teal-deep)}
td.l button{background:var(--sun);font-weight:700;font-size:18px;box-shadow:0 3px 0 var(--sun-deep)}

/* result */
.res{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.res .score{font-size:66px;font-weight:700;font-variant-numeric:tabular-nums}
.res .st{font-size:50px;letter-spacing:6px}
.res .st span{display:inline-block;animation:pop .5s backwards}
.res .duo svg,.res .duo img{width:110px}

footer{text-align:center;font-size:14px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:8px}
footer img{height:44px}
footer .sig{font-size:22px}

/* mascots: fly in from a side and cheer */
.masc{position:fixed;z-index:80;pointer-events:none;width:clamp(105px,22vw,150px);transition:transform .5s cubic-bezier(.34,1.56,.64,1);display:flex;flex-direction:column;align-items:center}
.masc.nx{width:clamp(130px,30vw,200px)}
.masc svg,.masc img{width:100%;height:auto;filter:drop-shadow(0 6px 6px rgba(0,0,0,.2))}
.masc.left{left:4px;bottom:110px;transform:translateX(-140%) rotate(-25deg)}
.masc.right{right:4px;bottom:110px;transform:translateX(140%) rotate(25deg)}
.masc.bottom{left:50%;bottom:-10px;transform:translate(-50%,120%)}
.masc.top{left:50%;top:6px;transform:translate(-50%,-140%)}
.masc.left.in{transform:translateX(0) rotate(6deg)}
.masc.right.in{transform:translateX(0) rotate(-6deg)}
.masc.bottom.in{transform:translate(-50%,0)}
.masc.top.in{transform:translate(-50%,0)}
.masc.in svg{animation:wiggle .6s ease-in-out 2}
.bub{background:#fff;border-radius:22px;padding:8px 14px;font-weight:700;font-size:clamp(18px,4vw,24px);box-shadow:0 5px 0 rgba(30,42,58,.15);position:relative;margin-bottom:6px;white-space:nowrap;text-align:center;max-width:calc(100vw - 16px)}
.masc.right .bub{align-self:flex-end}.masc.left .bub{align-self:flex-start}
.masc.right .bub::after{left:auto;right:40px}.masc.left .bub::after{left:40px;margin-left:0}
.bub .t-ar{font-size:15px}
.bub::after{content:"";position:absolute;bottom:-10px;left:50%;margin-left:-10px;border:10px solid transparent;border-top-color:#fff;border-bottom:0}
.masc.top{flex-direction:column-reverse}.masc.top .bub{margin:6px 0 0}.masc.top .bub::after{top:-10px;bottom:auto;border-top-color:transparent;border-bottom:10px solid #fff;border-top:0}
.conf{position:fixed;top:-40px;font-size:28px;pointer-events:none;z-index:70;animation:fall linear forwards}

@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{translate:0}25%{translate:-9px}75%{translate:9px}}
@keyframes burst{to{transform:scale(1.7);opacity:0}}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{from{transform:translateX(-200px)}to{transform:translateX(110vw)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}30%{transform:rotate(-8deg)}70%{transform:rotate(8deg)}}
.popa{animation:pop .4s}
@media (prefers-reduced-motion:reduce){.sky .sunb,.sky .cl,.ttl i,.tile .ic,.q .big,.duo svg,.hero .play,.cardbtn .tap,.welcome h1 i{animation:none}.conf{display:none}}
</style>
</head>
<body>
<div class="sky" aria-hidden="true"><div class="sunb"></div>
  <div class="cl" style="top:18%;animation-duration:70s;animation-delay:-20s"></div>
  <div class="cl" style="top:42%;animation-duration:95s;animation-delay:-60s;scale:.7"></div>
  <div class="cl" style="top:70%;animation-duration:80s;animation-delay:-5s;scale:.85"></div></div>

<div class="wrap">
  <header>
    <div class="logo"><img src="logo.webp" alt="Shams Alwatan School"><div class="ttl"><span id="ttl"></span><span class="sub">مدرسة شمس الوطن</span></div></div>
    <div class="tools"><span class="pill" id="stars">⭐ 0</span><button class="ib" id="sfxb" onclick="toggleSfx()" aria-label="sound">🔊</button><button class="ib arsw" id="arb" onclick="toggleAr()" aria-label="Arabic help on or off">ع</button><button class="ib" onclick="welcome()" aria-label="language">🌐</button></div>
  </header>
  <main id="app"></main>
  <footer>
    <img src="logo.webp" alt="">
    <span class="sig">تصميم وإعداد: خديجة عبد الهادي<small>Khadija Abdlhadi</small></span>
    <span class="arb">© مدرسة شمس الوطن. جميع الحقوق محفوظة.</span>
