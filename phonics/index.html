<style>
/* Layout: one big play card centred, home = grid of mode tiles, sunny classroom palette (single bright theme by choice) */
:root{
  --sky:#E8F4FB; --sun:#FFC83D; --sun-deep:#F5A400; --teal:#1C8C8C; --ink:#1E2A3A; --paper:#FFFFFF;
  --sh:#2F7FD8; --ch:#E2563C; --th:#7B4FC9; --good:#2E9E5B; --bad:#D64545; --muted:#5D6B7D;
  --display:"Fredoka",system-ui,sans-serif; --ar:"Tajawal","Segoe UI",Tahoma,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--display);font-size:18px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 28px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:28px;color:var(--ink)}
.logo .s{width:46px;height:46px;border-radius:50%;background:var(--sun);display:grid;place-items:center;font-size:26px;box-shadow:0 0 0 6px #FFE59A}
.stars{background:var(--paper);border-radius:999px;padding:6px 14px;font-weight:600;font-variant-numeric:tabular-nums}
.ar{font-family:var(--ar);direction:rtl;font-weight:500;color:var(--muted);font-size:15px}
button{font-family:inherit;cursor:pointer;border:0}
button:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
.home{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.tile{background:var(--paper);border-radius:22px;padding:18px;text-align:left;display:flex;flex-direction:column;gap:6px;
  border-bottom:6px solid var(--c,var(--sun-deep));transition:transform .15s}
.tile:hover{transform:translateY(-3px)}
.tile .ic{font-size:36px}
.tile b{font-size:22px;color:var(--ink)}
.card{background:var(--paper);border-radius:26px;padding:20px;display:flex;flex-direction:column;gap:16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.back{background:var(--sky);color:var(--ink);padding:8px 14px;border-radius:999px;font-weight:600}
h2{margin:0;font-size:24px;text-wrap:balance}
.dg{display:flex;gap:8px;flex-wrap:wrap}
.dg button{padding:8px 18px;border-radius:999px;font-weight:700;font-size:20px;color:#fff;background:var(--c);opacity:.45}
.dg button.on{opacity:1}
.words{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.word{background:var(--sky);border-radius:18px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:4px}
.word .e{font-size:46px;line-height:1.1}
.word .t{font-size:26px;font-weight:600;letter-spacing:.5px}
.hl{color:var(--c);font-weight:700;text-decoration:underline;text-underline-offset:4px}
.sent{display:flex;flex-direction:column;gap:8px}
.sent button{background:var(--sky);text-align:left;padding:10px 14px;border-radius:14px;font-size:19px;color:var(--ink)}
.rule{background:#FFF4D1;border-radius:16px;padding:12px 14px;font-weight:600;text-align:center}
.q{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.q .big{font-size:84px;line-height:1}
.q .prompt{font-size:38px;font-weight:700;letter-spacing:1px}
.q .syll{font-size:72px;font-weight:700;color:var(--teal);background:var(--sky);border-radius:22px;padding:4px 30px}
.hear{background:var(--sun);color:var(--ink);padding:10px 20px;border-radius:999px;font-weight:600;font-size:18px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.opt{background:var(--sky);border-radius:18px;padding:14px 6px;font-size:28px;font-weight:700;color:var(--ink);border:3px solid transparent;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.opt .e{font-size:42px}
.opt .t{font-size:20px;font-weight:600}
.opt.right{border-color:var(--good);background:#E3F6EA}
.opt.wrong{border-color:var(--bad);background:#FCE6E6}
.bar{height:12px;background:var(--sky);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--sun-deep);transition:width .3s}
.fb{min-height:30px;text-align:center;font-size:22px;font-weight:700}
.next{background:var(--teal);color:#fff;padding:12px 28px;border-radius:999px;font-size:20px;font-weight:600;align-self:center}
.table{overflow-x:auto}
table{border-collapse:separate;border-spacing:6px;margin:0 auto}
th{color:var(--muted);font-size:18px}
td button{background:var(--sky);border-radius:12px;padding:6px 8px;min-width:74px;color:var(--ink);font-size:16px;line-height:1.2}
td button b{display:block;font-size:20px;color:var(--teal)}
td.l{font-weight:700;font-size:22px;color:var(--ink);text-align:center}
.res{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.res .score{font-size:64px;font-weight:700;font-variant-numeric:tabular-nums}
.res .st{font-size:44px;letter-spacing:4px}
footer{text-align:center;font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
footer .sig{font-family:var(--ar);font-weight:700;color:var(--ink)}
.go{display:flex;width:100%;margin-bottom:14px;align-items:center;gap:16px;background:var(--sun);color:var(--ink);border-radius:26px;padding:18px 22px;text-align:left;box-shadow:0 6px 0 var(--sun-deep)}
.go .gi{width:64px;height:64px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-size:30px;color:var(--teal);flex:none}
.go b{display:block;font-size:30px}
.go .ar{color:var(--ink);font-size:17px}
.path{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.step{background:var(--paper);border-radius:20px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;border:3px solid transparent;color:var(--ink)}
.step .ic{font-size:38px}.step b{font-size:19px}.step .ar{font-size:13px;text-align:center}
.step .num{position:absolute;top:8px;left:10px;width:26px;height:26px;border-radius:50%;background:var(--sky);font-size:14px;font-weight:700;display:grid;place-items:center}
.step.ok .num{background:var(--good);color:#fff}
.step.cur{border-color:var(--sun-deep)}
.guide{background:#FFF4D1;border-radius:14px;padding:10px 14px;text-align:center;color:var(--ink);font-size:17px}
.word.lit{background:#FFE59A;transform:scale(1.05)}
.word{transition:transform .2s,background .2s}
td.l button{background:var(--sun);border-radius:12px;padding:6px 10px;font-weight:700;font-size:18px;color:var(--ink)}
.next{align-self:center}
@media (max-width:420px){.opts{gap:6px}.opt{font-size:22px}.opt .e{font-size:34px}.q .big{font-size:68px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.pop{animation:pop .4s}
</style>
</head>
