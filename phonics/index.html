<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="copyright" content="© مدرسة شمس الوطن. جميع الحقوق محفوظة.">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shams Phonics Star</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Tajawal:wght@500;700&display=swap">
<style>
/* Sunny classroom palette, one bright theme by choice. Home = continue button, sound cards grid, games grid. */
:root{
  --sky:#E8F4FB; --sun:#FFC83D; --sun-deep:#F5A400; --teal:#1C8C8C; --ink:#1E2A3A; --paper:#FFFFFF;
  --good:#2E9E5B; --bad:#D64545; --muted:#5D6B7D; --green:#2E6B3A;
  --display:"Fredoka",system-ui,sans-serif; --ar:"Tajawal","Segoe UI",Tahoma,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--display);font-size:18px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 80px}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:28px;color:var(--ink)}
.logo img{height:64px;width:auto}
.stars{background:var(--paper);border-radius:999px;padding:6px 14px;font-weight:600;font-variant-numeric:tabular-nums;font-size:20px}
.ar{font-family:var(--ar);direction:rtl;font-weight:500;color:var(--muted);font-size:15px}
button{font-family:inherit;cursor:pointer;border:0;color:inherit}
button:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
h2{margin:0;font-size:24px;text-wrap:balance}
h3{margin:6px 0 0;font-size:22px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h3 .ar{font-size:16px}

/* home */
.go{display:flex;width:100%;align-items:center;gap:16px;background:var(--sun);color:var(--ink);border-radius:26px;padding:16px 20px;text-align:left;box-shadow:0 6px 0 var(--sun-deep)}
.go:active{transform:translateY(3px);box-shadow:0 3px 0 var(--sun-deep)}
.go img{width:72px;height:72px;border-radius:18px;object-fit:cover;flex:none;background:var(--paper)}
.go b{display:block;font-size:28px}
.go .ar{color:var(--ink);font-size:17px}
.grp{display:flex;flex-direction:column;gap:8px}
.grp .gl{font-size:15px;color:var(--muted);font-weight:600;display:flex;gap:8px;align-items:center}
.sounds{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.snd{background:var(--paper);border-radius:20px;padding:8px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;border:3px solid transparent;transition:transform .15s}
.snd:hover{transform:translateY(-3px)}
.snd img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;background:var(--sky)}
.snd b{font-size:22px;letter-spacing:.5px}
.snd .ok{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;background:var(--good);color:#fff;display:grid;place-items:center;font-size:16px;font-weight:700}
.snd.cur{border-color:var(--sun-deep)}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.tile{background:var(--paper);border-radius:22px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:4px;border-bottom:6px solid var(--c,var(--sun-deep));transition:transform .15s}
.tile:hover{transform:translateY(-3px)}
.tile .ic{font-size:40px;line-height:1}
.tile b{font-size:21px}
.tile .best{font-size:15px;letter-spacing:2px}

/* common card */
.card{background:var(--paper);border-radius:26px;padding:20px;display:flex;flex-direction:column;gap:16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.top>div{flex:1;min-width:0}.top .back{flex:none}
.back{background:var(--sky);color:var(--ink);padding:8px 14px;border-radius:999px;font-weight:600}
.guide{background:#FFF4D1;border-radius:14px;padding:10px 14px;text-align:center;color:var(--ink);font-size:17px}
.next{background:var(--teal);color:#fff;padding:12px 28px;border-radius:999px;font-size:20px;font-weight:600;align-self:center}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{background:var(--sky);padding:8px 14px;border-radius:999px;font-weight:600;font-size:16px}
.chip.on{background:var(--teal);color:#fff}

/* learn */
.learn{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:18px;align-items:start}
.learn .cardimg{width:100%;border-radius:18px;box-shadow:0 4px 14px rgba(30,42,58,.15);display:block}
.learn .side{display:flex;flex-direction:column;gap:12px}
.gr{display:flex;gap:8px;flex-wrap:wrap}
.gr span{font-size:44px;font-weight:700;background:var(--sky);border-radius:16px;padding:0 16px;color:var(--c)}
.act{background:#E9F6EE;border-radius:16px;padding:12px 14px;display:flex;gap:10px;align-items:center}
.act .ar{color:var(--ink);font-size:17px;flex:1}
.hear{background:var(--sun);color:var(--ink);padding:10px 20px;border-radius:999px;font-weight:600;font-size:18px;flex:none}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.word{background:var(--sky);border-radius:18px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .2s,background .2s}
.word .e{font-size:42px;line-height:1.1}
.word .t{font-size:24px;font-weight:600;letter-spacing:.5px}
.word.lit{background:#FFE59A;transform:scale(1.05)}
.hl{color:var(--c);font-weight:700;text-decoration:underline;text-underline-offset:4px}
@media (max-width:560px){.learn{grid-template-columns:1fr}.learn .cardimg{max-width:240px;margin:0 auto}}

/* quiz */
.bar{height:12px;background:var(--sky);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--sun-deep);transition:width .3s}
.q{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.q .big{font-size:84px;line-height:1}
.q .pic{width:min(240px,60vw);aspect-ratio:1;border-radius:22px;object-fit:cover}
.q .prompt{font-size:44px;font-weight:700;letter-spacing:2px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.opt{background:var(--sky);border-radius:18px;padding:14px 6px;font-size:30px;font-weight:700;color:var(--ink);border:3px solid transparent;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.opt .e{font-size:50px;line-height:1.1}
.opt .t{font-size:20px;font-weight:600}
.opt.right{border-color:var(--good);background:#E3F6EA}
.opt.wrong{border-color:var(--bad);background:#FCE6E6;animation:shake .4s}
.fb{min-height:30px;text-align:center;font-size:22px;font-weight:700}

/* balloon pop */
.hud{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-weight:600;font-size:20px;font-variant-numeric:tabular-nums}
.target{display:flex;align-items:center;gap:12px;background:var(--sky);border-radius:18px;padding:8px 12px}
.target img{width:64px;height:64px;border-radius:14px;object-fit:cover}
.target b{font-size:34px;color:var(--teal)}
.arena{position:relative;height:min(60vh,520px);border-radius:22px;overflow:hidden;background:linear-gradient(#BFE6FA,#E8F7FF 70%,#D9F2D0);touch-action:manipulation}
.cloud{position:absolute;font-size:60px;opacity:.8;pointer-events:none}
.bal{position:absolute;left:0;top:0;width:116px;height:136px;padding:0;background:none;will-change:transform}
.bal .bb{width:116px;height:116px;border-radius:50% 50% 46% 46%;background:var(--bc);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;box-shadow:inset -10px -12px 0 rgba(0,0,0,.12),inset 8px 8px 0 rgba(255,255,255,.25)}
.bal .bb .e{font-size:38px;line-height:1}
.bal .bb .t{font-size:20px;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.bal .str{display:block;width:2px;height:20px;background:#7A8797;margin:0 auto}
.bal.popd .bb{animation:burst .3s forwards}
.bal.no .bb{animation:shake .4s}
.over{position:absolute;inset:0;display:grid;place-items:center;background:rgba(232,244,251,.85);text-align:center}

/* memory */
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mc{display:block;position:relative;width:100%;aspect-ratio:1;border-radius:16px;perspective:600px;padding:0;background:none}
.mc .in{position:absolute;inset:0;transition:transform .4s;transform-style:preserve-3d}
.mc.f .in,.mc.m .in{transform:rotateY(180deg)}
.mc .fa,.mc .ba{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;display:grid;place-items:center;overflow:hidden}
.mc .fa{background:var(--sun);font-size:40px;box-shadow:inset 0 -6px 0 var(--sun-deep)}
.mc .ba{transform:rotateY(180deg);background:var(--sky);font-size:clamp(20px,5vw,34px);font-weight:700;color:var(--teal);text-align:center;line-height:1.1}
.mc .ba img{width:100%;height:100%;object-fit:cover}
.mc.m .ba{outline:4px solid var(--good);outline-offset:-4px}
@media (max-width:420px){.mem{grid-template-columns:repeat(3,1fr)}.opts{gap:6px}.opt{font-size:24px}.opt .e{font-size:40px}.q .big{font-size:68px}}

/* table */
.table{overflow-x:auto}
table{border-collapse:separate;border-spacing:6px;margin:0 auto}
th{color:var(--muted);font-size:18px}
td button{background:var(--sky);border-radius:12px;padding:6px 8px;min-width:74px;color:var(--ink);font-size:16px;line-height:1.2}
td button b{display:block;font-size:20px;color:var(--teal)}
td.l button{background:var(--sun);border-radius:12px;padding:6px 10px;font-weight:700;font-size:18px;color:var(--ink)}

/* result */
.res{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.res .score{font-size:64px;font-weight:700;font-variant-numeric:tabular-nums}
.res .st{font-size:44px;letter-spacing:4px}
footer{text-align:center;font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.conf{position:fixed;top:-40px;font-size:28px;pointer-events:none;z-index:50;animation:fall linear forwards}

@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{translate:0}25%{translate:-8px}75%{translate:8px}}
@keyframes burst{to{transform:scale(1.6);opacity:0}}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.pop{animation:pop .4s}
@media (prefers-reduced-motion:reduce){.tile,.snd,.word,.mc .in{transition:none}.conf{display:none}}
</style>
</head>
