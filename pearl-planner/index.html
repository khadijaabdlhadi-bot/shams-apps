<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="copyright" content="© مدرسة شمس الوطن. جميع الحقوق محفوظة.">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1638">
<meta name="robots" content="noindex">
<title>مذكّرة اللؤلؤ — تنظيم عملي في مدرسة شمس الوطن</title>
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="مذكّرة اللؤلؤ">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>:root{--ink:#f4f1ff;--mute:#b9c3e6;--pearl:#fbf6ee;--gold:#e9c98b;--aqua:#6fe3e1;--lav:#b79cff;--rose:#ff9fc4;--deep:#0b1638;--glass:rgba(20,28,72,.55);--line:rgba(255,255,255,.14);--red:#ff7a93;--amber:#ffcf7a;--green:#7ef0c0;--r:22px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#0b1638;height:100%}
body{margin:0;min-height:100%;font-family:Tajawal,system-ui,sans-serif;color:var(--ink);font-size:17px;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea,select{font:inherit;color:var(--ink)}
.sea{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(1200px 700px at 80% -10%,#5b3ea8 0%,transparent 60%),radial-gradient(900px 600px at 0% 100%,#0f6c7a 0%,transparent 60%),linear-gradient(170deg,#141a4d 0%,#1d1658 40%,#0c2f55 75%,#083f52 100%)}
.sea-img{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1s}
.sea-img.on{opacity:1}
.sea-img.on::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,22,56,.25),rgba(11,22,56,.5))}
body.has-img .moon,body.has-img .pisces,body.has-img .stars,body.has-img .waves{display:none}
.bgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.bgo{display:flex;flex-direction:column;gap:6px;font-size:13px;text-align:center;padding:6px;border-radius:16px;border:2px solid transparent;background:rgba(255,255,255,.05)}
.bgo span{display:block;aspect-ratio:3/4;border-radius:11px;background-size:cover;background-position:center}
.bgo.on{border-color:var(--gold);box-shadow:0 0 14px rgba(233,201,139,.5)}
.moon{position:absolute;top:3%;left:4%;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fffaf0,#f3e6ff 45%,#c9b8ff 70%,transparent 72%);box-shadow:0 0 80px 30px rgba(220,200,255,.25);opacity:.7;animation:glow 6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 110px 45px rgba(220,200,255,.35)}}
.stars{position:absolute;inset:0;background-image:radial-gradient(1.5px 1.5px at 20% 15%,#fff,transparent),radial-gradient(1px 1px at 70% 8%,#fff,transparent),radial-gradient(1.5px 1.5px at 85% 30%,#ffe9b8,transparent),radial-gradient(1px 1px at 40% 25%,#fff,transparent),radial-gradient(1px 1px at 55% 40%,#d6ccff,transparent),radial-gradient(1.5px 1.5px at 10% 45%,#fff,transparent),radial-gradient(1px 1px at 92% 52%,#fff,transparent),radial-gradient(1px 1px at 30% 60%,#bdf6ff,transparent);animation:tw 5s ease-in-out infinite alternate}
@keyframes tw{to{opacity:.45}}
.pisces{position:absolute;width:min(70vmin,560px);height:min(70vmin,560px);left:50%;top:48%;transform:translate(-50%,-50%);color:rgba(233,201,139,.16);animation:spin 80s linear infinite}
.pisces .f1{transform:translate(200px,120px)}
.pisces .f2{transform:translate(200px,280px) rotate(180deg)}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.bubbles span{position:absolute;bottom:-30px;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.9),rgba(190,240,255,.25) 40%,rgba(255,255,255,.05) 70%);border:1px solid rgba(255,255,255,.3);animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-115vh) translateX(30px)}}
.waves{position:absolute;bottom:0;left:0;width:200%;height:180px;animation:drift 22s linear infinite}
.waves .w1{fill:rgba(111,227,225,.10)}.waves .w2{fill:rgba(183,156,255,.10)}.waves .w3{fill:rgba(11,22,56,.45)}
@keyframes drift{to{transform:translateX(50%)}}
@media (prefers-reduced-motion:reduce){.pisces,.waves,.bubbles span,.moon,.stars{animation:none}}

.app{display:flex;min-height:100vh;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
.side{width:290px;flex:none;padding:22px 16px 120px;position:sticky;top:0;height:100vh;overflow-y:auto;border-inline-end:1px solid var(--line);background:linear-gradient(180deg,rgba(15,20,60,.55),rgba(10,30,60,.35));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:12px;margin:0 6px 22px}
.brand h1{font-family:"Aref Ruqaa",serif;font-size:27px;margin:0;line-height:1.1;background:linear-gradient(90deg,#fff6e2,#e9c98b,#ffd9ea);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.brand small{color:var(--mute);font-size:13px}
.pearl-logo{width:50px;height:50px;border-radius:50%;background:radial-gradient(circle at 32% 30%,#fff,#f6eefc 30%,#d9c8f5 60%,#9e88d6 100%);box-shadow:0 0 22px rgba(220,200,255,.55),inset -5px -6px 12px rgba(80,50,140,.35);position:relative;flex:none}
.pearl-logo span{position:absolute;inset:-6px;border-radius:50%;border:1.5px solid rgba(233,201,139,.6)}
nav .grp{font-size:12.5px;color:var(--gold);letter-spacing:.5px;margin:18px 10px 6px;opacity:.9}
nav button{display:flex;align-items:center;gap:11px;width:100%;padding:9px 10px;border-radius:14px;text-align:start;transition:background .2s,transform .2s}
nav button:hover{background:rgba(255,255,255,.06)}
nav button.on{background:linear-gradient(90deg,rgba(183,156,255,.28),rgba(111,227,225,.14));box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)}
nav .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px;flex:none;color:#1a1640;box-shadow:inset 0 -3px 6px rgba(0,0,0,.15)}
nav .nm{flex:1;font-weight:600;font-size:16px}
nav .ct{min-width:24px;height:24px;border-radius:12px;padding:0 7px;display:grid;place-items:center;font-size:13px;font-weight:800;background:rgba(255,255,255,.12)}
nav .ct.late{background:var(--red);color:#2a0715}
.main{flex:1;min-width:0;padding:26px 30px 140px}
.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.hd h2{font-family:"Aref Ruqaa",serif;font-size:38px;margin:0;line-height:1.15;text-shadow:0 2px 18px rgba(183,156,255,.45)}
.hd p{margin:4px 0 0;color:var(--mute)}
.card{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);padding:18px;backdrop-filter:blur(16px) saturate(130%);-webkit-backdrop-filter:blur(16px) saturate(130%);box-shadow:0 12px 40px rgba(5,8,30,.35)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.stat{padding:16px;border-radius:20px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);cursor:pointer;transition:transform .2s}
.stat:active{transform:scale(.97)}
.stat b{display:block;font-size:34px;line-height:1}
.stat span{color:var(--mute);font-size:14px}
.stat.late b{color:var(--red)}.stat.today b{color:var(--amber)}.stat.week b{color:var(--aqua)}.stat.done b{color:var(--green)}
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:18px}
.ttl{font-weight:800;font-size:18px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.ttl em{font-style:normal;color:var(--mute);font-weight:500;font-size:14px}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;border-radius:18px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);position:relative;overflow:hidden;transition:transform .25s,opacity .4s,background .2s;cursor:pointer}
.item::before{content:"";position:absolute;inset-inline-start:0;top:10px;bottom:10px;width:4px;border-radius:4px;background:var(--c,#b79cff)}
.item:hover{background:rgba(255,255,255,.1)}
.item.done{opacity:.55}.item.done .it-t{text-decoration:line-through}
.chk{width:30px;height:30px;border-radius:50%;flex:none;border:2px solid rgba(255,255,255,.55);display:grid;place-items:center;margin-top:1px;transition:all .25s;background:rgba(255,255,255,.04)}
.chk.on{background:radial-gradient(circle at 35% 30%,#fff,#e6dcff 45%,#a68cf0);border-color:#fff;box-shadow:0 0 14px rgba(200,180,255,.8)}
.chk.on::after{content:"✓";color:#2a1d66;font-weight:900}
.it-b{flex:1;min-width:0}
.it-t{font-weight:700;font-size:17px;line-height:1.4}
.it-d{color:var(--mute);font-size:14.5px;margin-top:2px;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.it-m{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.tag{font-size:12.5px;padding:3px 9px;border-radius:20px;background:rgba(255,255,255,.1);white-space:nowrap}
.tag.late{background:rgba(255,122,147,.25);color:#ffd2dc}.tag.today{background:rgba(255,207,122,.22);color:#ffe8bf}.tag.soon{background:rgba(111,227,225,.18);color:#c9fbfa}
.tag.p2{background:rgba(255,207,122,.22)}.tag.p3{background:rgba(255,122,147,.3)}
.thumb{width:58px;height:58px;border-radius:12px;object-fit:cover;flex:none;border:1px solid var(--line)}
.empty{text-align:center;padding:34px 10px;color:var(--mute)}
.empty .shell{font-size:44px;display:block;margin-bottom:6px;filter:drop-shadow(0 0 10px rgba(255,255,255,.3))}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-h b{font-size:18px}
.cal-h button{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.08);font-size:18px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.cal .dn{font-size:12px;color:var(--mute);padding:4px 0}
.cal .d{height:clamp(40px,5.2vw,54px);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;position:relative;background:rgba(255,255,255,.04);transition:background .2s}
.cal .d.o{opacity:.3}
.cal .d.t{background:linear-gradient(135deg,rgba(183,156,255,.55),rgba(111,227,225,.35));font-weight:800;box-shadow:0 0 14px rgba(183,156,255,.5)}
.cal .d.sel{outline:2px solid var(--gold)}
.cal .dots{display:flex;gap:2px;margin-top:2px;height:6px}
.cal .dots i{width:5px;height:5px;border-radius:50%;background:var(--c)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:8px 14px;border-radius:20px;background:rgba(255,255,255,.08);border:1px solid var(--line);font-size:15px}
.chip.on{background:linear-gradient(90deg,rgba(183,156,255,.45),rgba(111,227,225,.3));border-color:rgba(255,255,255,.35)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:16px;font-weight:700;background:rgba(255,255,255,.1);border:1px solid var(--line);transition:transform .15s}
.btn:active{transform:scale(.96)}
.btn.pr{background:linear-gradient(135deg,#c6b2ff,#86e6e4);color:#1c1846;border:0;box-shadow:0 8px 24px rgba(150,130,255,.4)}
.btn.gd{background:linear-gradient(135deg,#fff1cf,#e2bd78);color:#3a2a0b;border:0}
.btn.dg{background:rgba(255,122,147,.18);color:#ffd2dc}
.btn.sm{padding:8px 13px;font-size:14.5px;border-radius:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.fab{position:fixed;bottom:calc(26px + env(safe-area-inset-bottom));right:calc(26px + env(safe-area-inset-right));width:68px;height:68px;border-radius:50%;font-size:36px;font-weight:300;color:#1c1846;background:radial-gradient(circle at 32% 28%,#fff,#efe6ff 35%,#b7a0f5 75%,#8f78e0);box-shadow:0 0 0 6px rgba(255,255,255,.1),0 10px 30px rgba(120,90,230,.6);z-index:20;transition:transform .2s}
.fab:active{transform:scale(.9) rotate(90deg)}
.ov{position:fixed;inset:0;background:rgba(5,8,28,.55);opacity:0;visibility:hidden;transition:.3s;z-index:40;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.ov.on{opacity:1;visibility:visible}
.sheet{position:fixed;left:50%;bottom:0;width:min(760px,100%);max-height:92vh;overflow-y:auto;transform:translate(-50%,105%);transition:transform .45s cubic-bezier(.2,.9,.25,1.05);z-index:41;background:linear-gradient(170deg,rgba(38,34,96,.97),rgba(14,46,82,.97));border:1px solid rgba(255,255,255,.18);border-bottom:0;border-radius:30px 30px 0 0;padding:26px 26px calc(30px + env(safe-area-inset-bottom));box-shadow:0 -20px 60px rgba(0,0,0,.45);visibility:hidden}
.sheet.on{transform:translate(-50%,0);visibility:visible}
.sheet-x{position:absolute;top:16px;left:16px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.1);font-size:18px}
.sheet h3{font-family:"Aref Ruqaa",serif;font-size:28px;margin:0 0 16px;padding-inline-end:50px}
.f{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.f label{font-size:14.5px;color:var(--gold);font-weight:700}
.in{width:100%;padding:13px 15px;border-radius:15px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);outline:none;font-size:17px;transition:border .2s,background .2s}
.in:focus{border-color:var(--lav);background:rgba(255,255,255,.12)}
textarea.in{min-height:110px;resize:vertical;line-height:1.7}
select.in option{color:#111}
input[type=date].in,input[type=time].in{color-scheme:dark;min-height:50px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:max-content;padding:10px 12px;border-radius:13px;background:rgba(255,255,255,.07);border:1px solid var(--line);font-size:15px}
.seg button.on{background:linear-gradient(135deg,rgba(198,178,255,.5),rgba(134,230,228,.35));border-color:rgba(255,255,255,.4);font-weight:700}
.tog{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:15px;background:rgba(255,255,255,.06);border:1px solid var(--line);cursor:pointer}
.tog .sw{width:50px;height:30px;border-radius:15px;background:rgba(255,255,255,.2);position:relative;transition:.25s;flex:none}
.tog .sw::after{content:"";position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.25s}
.tog.on .sw{background:linear-gradient(90deg,#86e6e4,#c6b2ff)}
.tog.on .sw::after{right:23px}
.imgs{display:flex;gap:10px;flex-wrap:wrap}
.imgs .im{position:relative}
.imgs img{width:96px;height:96px;object-fit:cover;border-radius:14px;border:1px solid var(--line);cursor:zoom-in}
.imgs .x{position:absolute;top:-8px;left:-8px;width:26px;height:26px;border-radius:50%;background:var(--red);color:#2a0715;font-weight:900;font-size:14px}
.addimg{width:96px;height:96px;border-radius:14px;border:2px dashed rgba(255,255,255,.3);display:grid;place-items:center;font-size:13px;color:var(--mute);text-align:center;line-height:1.4}
.pts{display:flex;flex-direction:column;gap:8px}
.pt{display:flex;gap:8px;align-items:center}
.pt .in{padding:10px 12px}
.pt .n{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;font-size:14px;background:linear-gradient(135deg,#fff1cf,#e2bd78);color:#3a2a0b}
.pt .del{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.08);flex:none}
.meet{padding:18px;border-radius:22px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);cursor:pointer;transition:transform .2s;position:relative;overflow:hidden}
.meet::after{content:"";position:absolute;width:160px;height:160px;border-radius:50%;left:-50px;top:-60px;background:radial-gradient(circle,rgba(233,201,139,.22),transparent 70%)}
.meet:active{transform:scale(.98)}
.meets{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.meet h4{margin:0 0 6px;font-size:19px}
.meet .dt{color:var(--gold);font-size:14px}
.meet ul{margin:10px 0 0;padding-inline-start:20px;color:var(--mute);font-size:15px;line-height:1.7}
.mv h3{margin-bottom:6px}
.mv .dt{color:var(--gold);margin-bottom:14px}
.mv .det{white-space:pre-wrap;line-height:1.9;background:rgba(255,255,255,.06);border-radius:16px;padding:14px;margin-bottom:14px}
.mv ol{line-height:1.9;padding-inline-start:22px}
.mv ol li.ok{text-decoration:line-through;opacity:.6}
.mv ol li{cursor:pointer}
.banners{position:fixed;top:calc(16px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:10px;width:min(560px,92vw)}
.bn{display:flex;gap:14px;align-items:center;padding:16px 18px;border-radius:24px;background:linear-gradient(135deg,rgba(255,250,240,.97),rgba(238,228,255,.97));color:#221a52;box-shadow:0 20px 50px rgba(10,10,40,.5),0 0 0 1px rgba(255,255,255,.6);animation:bnIn .6s cubic-bezier(.2,1.3,.4,1)}
@keyframes bnIn{from{transform:translateY(-120%) scale(.9);opacity:0}}
.bn .pl{width:46px;height:46px;border-radius:50%;flex:none;background:radial-gradient(circle at 32% 28%,#fff,#efe6ff 35%,#b7a0f5 75%);box-shadow:0 0 16px rgba(150,120,255,.6);display:grid;place-items:center;font-size:22px;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.bn .tx{flex:1;min-width:0}.bn b{display:block;font-size:17px}.bn small{color:#5a5290}
.bn .ac{display:flex;flex-direction:column;gap:6px}
.bn .ac button{padding:7px 12px;border-radius:12px;font-size:13.5px;font-weight:700;background:#221a52;color:#fff}
.bn .ac button+button{background:rgba(34,26,82,.1);color:#221a52}
.toast{position:fixed;bottom:calc(110px + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,20px);opacity:0;visibility:hidden;transition:.3s;z-index:70;background:rgba(255,250,240,.96);color:#221a52;padding:12px 20px;border-radius:18px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.toast.on{opacity:1;visibility:visible;transform:translate(-50%,0)}
.viewer{position:fixed;inset:0;z-index:80;background:rgba(5,8,28,.92);display:none;place-items:center;padding:20px}
.viewer.on{display:grid}.viewer img{max-width:100%;max-height:100%;border-radius:16px}
.burst{position:fixed;pointer-events:none;z-index:90;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,rgba(200,180,255,.6));animation:burst .8s ease-out forwards}
@keyframes burst{to{transform:translate(var(--x),var(--y)) scale(.2);opacity:0}}
.sec-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.sec-row .in{padding:9px 12px}
.sec-row .av{width:30px;height:30px;border-radius:50%;flex:none}
.hint{font-size:14px;color:var(--mute);line-height:1.7}
.note{background:rgba(233,201,139,.12);border:1px solid rgba(233,201,139,.35);border-radius:16px;padding:12px 14px;line-height:1.8;font-size:15px;margin-bottom:12px}
.steps{line-height:2;padding-inline-start:22px;margin:6px 0}
.search{max-width:320px}
@media (max-width:900px){
  .app{flex-direction:column}
  .side{width:auto;height:auto;position:sticky;top:0;z-index:10;padding:12px 12px 10px;border:0;border-bottom:1px solid var(--line)}
  .brand{margin:0 4px 10px}.brand h1{font-size:22px}.pearl-logo{width:38px;height:38px}
  nav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  nav::-webkit-scrollbar{display:none}
  nav .grp{display:none}
  nav button{width:auto;flex:none;padding:7px 12px 7px 8px;border-radius:20px;background:rgba(255,255,255,.06)}
  nav .av{width:28px;height:28px;font-size:13px}
  nav .nm{font-size:14.5px;white-space:nowrap}
  .main{padding:18px 16px 140px}
  .grid2{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  .hd h2{font-size:31px}
}
@media (max-width:520px){.two{grid-template-columns:1fr}}

.quick{display:flex;gap:10px;align-items:center;padding:12px;margin-bottom:16px}
.quick #qa{flex:1}.quick select{width:auto;max-width:190px}
.quick .btn{width:52px;height:50px;font-size:24px;padding:0}
.prep{margin:16px 0;padding:16px;border-radius:18px;background:linear-gradient(135deg,rgba(233,201,139,.12),rgba(111,227,225,.08));border:1px solid rgba(233,201,139,.3)}
.prep .cal-h{flex-wrap:wrap;gap:8px}
.in.mini{display:inline-block;width:auto;padding:6px 10px;min-height:0;font-size:15px}
ul.rep{margin:4px 0 0;padding:0;list-style:none;line-height:1.9}
ul.rep li{padding:3px 0;border-bottom:1px dashed rgba(255,255,255,.08)}
@media (max-width:600px){.quick{flex-wrap:wrap}.quick #qa{flex-basis:100%}}

.rv-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.rv{padding:14px;border-radius:18px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-top:4px solid var(--c)}
.rv .ttl{color:var(--c);margin-bottom:6px}
.rv ol{margin:0;padding-inline-start:22px;line-height:1.85}
.rv ol li.ok{text-decoration:line-through;opacity:.55}
#rvLeft li{cursor:pointer}
.rv-n{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.rv-n span{font-size:14px;padding:4px 10px;border-radius:14px;background:rgba(255,255,255,.08);border-inline-start:3px solid var(--c)}
.rvf{padding:12px;border-radius:16px;background:rgba(255,255,255,.04);border-inline-start:4px solid var(--c)}
@media (max-width:700px){.rv-grid{grid-template-columns:1fr}}
</style>
