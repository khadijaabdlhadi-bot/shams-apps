<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="copyright" content="© مدرسة شمس الوطن. جميع الحقوق محفوظة.">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>حضور شمس الوطن</title>
<meta name="description" content="تسجيل حضور وانصراف مدرسات مدرسة شمس الوطن عبر الموقع.">
<meta name="theme-color" content="#13308f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-apple.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="حضور شمس">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="logo" style="background-image:url(logo.png)" role="img" aria-label="شعار مدرسة شمس الوطن"></div>
    <div>
      <h1>حضور شمس الوطن</h1>
      <p id="subtitle">سجّلي حضورك وانصرافك بلمسة</p>
    </div>
    <button class="act" id="logoutBtn" aria-label="تسجيل الخروج" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
    </button>
  </div>
</header>

<main class="wrap lift">
  <!-- الدخول -->
  <section class="card" id="loginView">
    <h2>أهلاً بك</h2>
    <p class="hint" style="margin-bottom:14px" id="loginHint">اكتبي رقم هاتفك للدخول. أول مرة؟ سيُطلب منك اسمك الرباعي لإنشاء حسابك.</p>
    <label class="field"><span>رقم الهاتف</span><input id="phone" class="tel" type="tel" inputmode="tel" autocomplete="tel" maxlength="16" placeholder="09XXXXXXXX"></label>
    <label class="field" id="nameBox" hidden><span>الاسم الرباعي</span><input id="fname" autocomplete="name" maxlength="60" placeholder="مثال: خديجة محمد علي أحمد"></label>
    <button class="btn block" id="loginBtn">دخول</button>
    <p class="err" id="loginErr"></p>
  </section>

  <!-- الرئيسية -->
  <div id="homeView" hidden>
    <section class="card">
      <h2 id="hello">أهلاً</h2>
      <p class="hint" id="dateLine"></p>

      <div class="radar" id="radar">
        <svg viewBox="0 0 300 300" aria-hidden="true">
          <defs>
            <radialGradient id="bgr"><stop offset="0" stop-color="#eef3ff"/><stop offset="1" stop-color="#dfe8fb"/></radialGradient>
            <linearGradient id="sw" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1d5fd6" stop-opacity="0"/><stop offset="1" stop-color="#1d5fd6" stop-opacity=".28"/></linearGradient>
          </defs>
          <circle cx="150" cy="150" r="145" fill="url(#bgr)"/>
          <circle cx="150" cy="150" r="145" fill="none" stroke="#c9d6f4" stroke-width="2"/>
          <circle cx="150" cy="150" r="45" fill="none" stroke="#c9d6f4" stroke-dasharray="3 5"/>
          <path d="M150 5V295M5 150H295" stroke="#d3def6" stroke-width="1"/>
          <circle class="ring" cx="150" cy="150" r="90" fill="rgba(31,157,85,.06)" stroke="#9aa6c8" stroke-width="3" stroke-dasharray="7 6"/>
          <g class="sweep"><path d="M150 150 L150 5 A145 145 0 0 1 250 45 Z" fill="url(#sw)"/></g>
          <circle cx="150" cy="150" r="17" fill="#f6b300"/>
          <path d="M150 140l12 8v10h-24v-10z" fill="#13308f"/>
          <circle cx="150" cy="150" r="17" fill="none" stroke="#fff" stroke-width="3"/>
          <g id="me" transform="translate(150,150)">
            <circle class="pulse" r="9" fill="#1d5fd6" opacity=".5"/>
            <circle r="9" fill="#1d5fd6" stroke="#fff" stroke-width="3"/>
          </g>
        </svg>
      </div>
      <div class="geo" id="geo"><i class="dot"></i><span id="geoText">جارٍ تحديد موقعك…</span></div>
      <p class="sub" id="geoSub"></p>

      <button class="punch" id="punch" disabled>…</button>
      <p class="sub" id="punchSub"></p>
    </section>

    <section class="card">
      <h2>يومك</h2>
      <div class="tiles">
        <div class="tile g"><b id="tIn">--:--</b><span>الحضور</span></div>
        <div class="tile o"><b id="tOut">--:--</b><span>الانصراف</span></div>
        <div class="tile"><b id="tWork">0</b><span>مدة الدوام</span></div>
      </div>
    </section>

    <section class="card">
      <h2>ملخص الشهر</h2>
      <div class="tiles" id="monthTiles"></div>
    </section>

    <section class="card">
      <h2>آخر الأيام</h2>
      <ul class="hist" id="hist"></ul>
    </section>
  </div>

  <p class="foot"><b>مدرسة شمس الوطن</b> — عين زارة، طرابلس<br><span id="sign"></span></p>
</main>

<div class="overlay" id="result" hidden>
  <div class="sheet">
    <div class="ic" id="rIc">✓</div>
    <h3 id="rTitle"></h3>
    <div class="time" id="rTime"></div>
    <p class="hint" id="rMsg"></p>
    <button class="btn" id="rClose">تمام</button>
  </div>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
<script src="../sign.js" data-pos="left" defer></script>
</body>
</html>
